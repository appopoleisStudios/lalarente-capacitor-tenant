# Owner FICA / screening — Run screening on Compliance → FICA (LAL-121)
# Taps Run screening when a tenant card exists. Rows can still be overridden
# after the automated RSA ID / affordability / references pass.
appId: com.lalarente.app
---
- runFlow: ../subflows/login-owner.yaml

- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 60000

- scrollUntilVisible:
    element:
      text: "Compliance"
    direction: DOWN
    timeout: 20000
    centerElement: true

- tapOn:
    text: "Compliance"

- extendedWaitUntil:
    visible: "FICA / Tenant KYC"
    timeout: 20000

- assertVisible:
    text: "Identity"
- assertVisible:
    text: "Credit"
- assertVisible:
    text: "Background"

- runFlow:
    when:
      visible:
        id: "screening-run-button"
    commands:
      - tapOn:
          id: "screening-run-button"
      - extendedWaitUntil:
          visible:
            id: "screening-run-result"
          timeout: 25000
      - assertVisible:
          id: "screening-run-result"
