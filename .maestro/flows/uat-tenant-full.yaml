# UAT — Tenant full journey
# Covers every tab and major screen as a real tenant would use the app.
# Run with: maestro test .maestro/flows/uat-tenant-full.yaml \
#             --env TENANT_EMAIL=<tenant-email> \
#             --env TENANT_PASSWORD=<tenant-password>
appId: com.lalarente.app
---
- runFlow: ../subflows/login-tenant.yaml

# ── 1. Dashboard — verify core elements ──────────────────────────────────────
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 45000
- assertVisible:
    text: "Welcome back,"
- takeScreenshot: uat-tenant-01-dashboard

# ── 2. Search tab ────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-search"
- extendedWaitUntil:
    visible:
      id: "tenant-search-results"
    timeout: 30000
- assertVisible:
    id: "tenant-search-results"
- takeScreenshot: uat-tenant-02-search

# ── 3. Payments tab ──────────────────────────────────────────────────────────
- tapOn:
    id: "tab-payments"
- extendedWaitUntil:
    visible: "Payments"
    timeout: 20000
- assertVisible:
    text: "Payments"
- takeScreenshot: uat-tenant-03-payments

# ── 4. Profile tab ───────────────────────────────────────────────────────────
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 20000
- takeScreenshot: uat-tenant-04-profile

# ── 5. Lala AI tab — chip interaction ────────────────────────────────────────
- tapOn:
    id: "tab-lala-ai"
- extendedWaitUntil:
    visible: "Lala Assistant"
    timeout: 20000
- assertVisible: "Lala Assistant"
- extendedWaitUntil:
    visible:
      id: "lala-chip-0"
    timeout: 15000
- tapOn:
    id: "lala-chip-0"
- extendedWaitUntil:
    visible:
      id: "lala-ai-message"
    timeout: 60000
- assertNotVisible:
    id: "lala-error-row"
- takeScreenshot: uat-tenant-05-lala-ai

# ── 6. Maintenance — list + new request form ─────────────────────────────────
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "qa-maintenance"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: "qa-maintenance"
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000
- assertVisible:
    text: "Maintenance"
- takeScreenshot: uat-tenant-06-maintenance

# New Request form
- runFlow:
    when:
      visible:
        id: "new-maintenance-button"
    commands:
      - tapOn:
          id: "new-maintenance-button"
      - extendedWaitUntil:
          visible: "Report Issue"
          timeout: 15000
      - assertVisible:
          text: "Report Issue"
      - takeScreenshot: uat-tenant-07-maintenance-new
      - back

- runFlow:
    when:
      notVisible:
        id: "new-maintenance-button"
    commands:
      - openLink: lalarenteapp://(tenant)/maintenance/report
      - extendedWaitUntil:
          visible: "Report Issue"
          timeout: 15000
      - assertVisible:
          text: "Report Issue"
      - takeScreenshot: uat-tenant-07-maintenance-new
      - back

# ── 7. Messages — thread list + compose ──────────────────────────────────────
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "qa-messages"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: "qa-messages"
- extendedWaitUntil:
    visible: "Messages"
    timeout: 15000
- assertVisible:
    text: "Messages"
- takeScreenshot: uat-tenant-08-messages

# Compose new message
- openLink: lalarenteapp://(tenant)/messages/new
- extendedWaitUntil:
    visible: "New Message"
    timeout: 15000
- assertVisible:
    text: "New Message"
- takeScreenshot: uat-tenant-09-messages-compose
- back

# ── 8. Notifications ─────────────────────────────────────────────────────────
- openLink: lalarenteapp://(tenant)/notifications
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 15000
- assertVisible:
    text: "Notifications"
- takeScreenshot: uat-tenant-10-notifications
- back

# ── 9. Lease details ─────────────────────────────────────────────────────────
- openLink: lalarenteapp://(tenant)/lease
- extendedWaitUntil:
    visible: "Lease"
    timeout: 15000
- assertVisible:
    text: "Lease"
- takeScreenshot: uat-tenant-11-lease
- back

# ── 10. Deposit ──────────────────────────────────────────────────────────────
- openLink: lalarenteapp://(tenant)/deposit
- extendedWaitUntil:
    visible: "Deposit"
    timeout: 15000
- assertVisible:
    text: "Deposit"
- takeScreenshot: uat-tenant-12-deposit
- back

# ── 11. Arrears ──────────────────────────────────────────────────────────────
- openLink: lalarenteapp://(tenant)/arrears
- extendedWaitUntil:
    visible: "My Arrears"
    timeout: 20000
- assertVisible:
    text: "My Arrears"
- takeScreenshot: uat-tenant-13-arrears
- back

# ── 12. Reports ──────────────────────────────────────────────────────────────
- openLink: lalarenteapp://(tenant)/reports
- extendedWaitUntil:
    visible: "Reports"
    timeout: 20000
- assertVisible:
    text: "Reports"
- takeScreenshot: uat-tenant-14-reports
- back

# ── 13. Documents ────────────────────────────────────────────────────────────
- openLink: lalarenteapp://(tenant)/documents
- extendedWaitUntil:
    visible: "Documents"
    timeout: 15000
- assertVisible:
    text: "Documents"
- takeScreenshot: uat-tenant-15-documents
- back

# ── 14. Viewings (accessed via deep link — not a tab) ────────────────────────
- openLink: lalarenteapp://(tenant)/viewings
- extendedWaitUntil:
    visible: "Viewings"
    timeout: 15000
- assertVisible:
    text: "Viewings"
- takeScreenshot: uat-tenant-16-viewings
- back

# ── 15. Application status ───────────────────────────────────────────────────
- openLink: lalarenteapp://(tenant)/application-status
- extendedWaitUntil:
    visible: "My Applications"
    timeout: 15000
- assertVisible:
    text: "My Applications"
- takeScreenshot: uat-tenant-17-application-status
- back

# ── 16. Payment disputes ─────────────────────────────────────────────────────
- openLink: lalarenteapp://(tenant)/payment-disputes
- extendedWaitUntil:
    visible:
      id: "payment-disputes-title"
    timeout: 30000
- assertVisible:
    text: "No payment disputes"
    optional: true
- takeScreenshot: uat-tenant-18-payment-disputes
- back

# ── 17. Holding deposit ──────────────────────────────────────────────────────
- openLink: lalarenteapp://(tenant)/holding-deposit
- extendedWaitUntil:
    visible: "Holding Deposits"
    timeout: 20000
- assertVisible:
    text: "Holding Deposits"
- takeScreenshot: uat-tenant-19-holding-deposit
- back

# ── 18. Lease renewal ────────────────────────────────────────────────────────
- openLink: lalarenteapp://(tenant)/lease-renewal
- extendedWaitUntil:
    visible: "Lease Renewal"
    timeout: 15000
- assertVisible:
    text: "Lease Renewal"
- takeScreenshot: uat-tenant-20-lease-renewal
- back

# ── 19. Early termination ────────────────────────────────────────────────────
- openLink: lalarenteapp://(tenant)/early-termination
- extendedWaitUntil:
    visible: "Early Termination"
    timeout: 20000
- assertVisible:
    text: "Early Termination"
- takeScreenshot: uat-tenant-21-early-termination
- back

# ── 20. Search: tap a listing detail ─────────────────────────────────────────
- tapOn:
    id: "tab-search"
- extendedWaitUntil:
    visible:
      id: "tenant-search-results"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: uat-tenant-22-search-loaded

# ── Done ─────────────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 30000
- takeScreenshot: uat-tenant-99-done

# Sign out so the next UAT role starts on the login screen (avoids dev-build restart issues)
- runFlow: ../subflows/sign-out-tenant.yaml
