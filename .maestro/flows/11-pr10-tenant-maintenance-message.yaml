# PR #10 — Maintenance list + message landlord (S2-39, S2-30)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml
- runFlow: ../subflows/tap-tenant-maintenance.yaml
- assertVisible: "Maintenance"

- scrollUntilVisible:
    element: "Message landlord"
    direction: DOWN
    timeout: 15000
    optional: true

- tapOn:
    text: "Message landlord"
    index: 0
    optional: true

- extendedWaitUntil:
    visible: "Type a message"
    timeout: 20000
    optional: true
