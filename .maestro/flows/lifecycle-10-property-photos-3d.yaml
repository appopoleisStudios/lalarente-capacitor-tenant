# Property photos and 3D tour — owner uploads a listing photo, it shows in the
# owner list, owner detail, tenant search and tenant detail; a dead 3D tour link
# is rejected on save; with no tour attached, View in 3D shows "Feature coming
# soon" for both roles.
# PRECONDITION: the simulator photo library has at least one photo
# (xcrun simctl addmedia <udid> <image>). The picker tap uses a screen point.
# Leaves the uploaded photo on LC_PROPERTY (intended: listings need photos).
# Env: creds, LC_PROPERTY_ID, LC_PROPERTY_TITLE
appId: com.lalarente.app
---
# ── OWNER ─────────────────────────────────────────────────────────────────
- runFlow: ../subflows/login-owner.yaml
- openLink: lalarenteapp://(owner)/properties/${LC_PROPERTY_ID}/edit
- extendedWaitUntil:
    visible:
      id: "owner-edit-property-select-photos"
    timeout: 25000

# ── dead 3D tour link is rejected on save ─────────────────────────────────
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "owner-edit-property-3d-url"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "owner-edit-property-3d-url"
- eraseText: 30
- inputText: "https://my.matterport.com/show/?m=EjJbLb4oBbA"
- tapOn:
    text: "Property Photos"
- tapOn:
    id: "owner-edit-property-save"
- extendedWaitUntil:
    visible: ".*could not be found.*"
    timeout: 30000
- tapOn:
    text: "OK"
- tapOn:
    id: "owner-edit-property-3d-url"
- eraseText: 30
- eraseText: 80
- tapOn:
    text: "Property Photos"

# ── pick a photo, remove it, pick again ───────────────────────────────────
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "owner-edit-property-select-photos"
    direction: UP
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "owner-edit-property-select-photos"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    point: "17%,22%"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "(Add|Done|Choose)"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- extendedWaitUntil:
    visible:
      id: "owner-edit-property-photo"
    timeout: 15000
- takeScreenshot: lc10-photo-picked
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "owner-edit-property-photo-remove"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "owner-edit-property-select-photos"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    point: "17%,22%"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "(Add|Done|Choose)"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- extendedWaitUntil:
    visible:
      id: "owner-edit-property-photo"
    timeout: 15000

# ── save uploads the photo ────────────────────────────────────────────────
- tapOn:
    id: "owner-edit-property-save"
- extendedWaitUntil:
    visible: "Property updated successfully!"
    timeout: 60000
- tapOn:
    text: "OK"
- takeScreenshot: lc10-saved
- waitForAnimationToEnd:
    timeout: 1500

# ── owner list and detail show the photo; no tour -> coming soon ──────────
- openLink: lalarenteapp://(owner)/properties
- extendedWaitUntil:
    visible: "My Properties"
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "property-card-image"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- takeScreenshot: lc10-owner-list-photo
- waitForAnimationToEnd:
    timeout: 1500
- openLink: lalarenteapp://(owner)/properties/${LC_PROPERTY_ID}
- extendedWaitUntil:
    visible:
      id: "owner-property-photo"
    timeout: 25000
- takeScreenshot: lc10-owner-detail-photo
- waitForAnimationToEnd:
    timeout: 1500
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "owner-view-3d"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "owner-view-3d"
- extendedWaitUntil:
    visible: "Feature coming soon"
    timeout: 15000
- tapOn:
    text: "OK"
- openLink: lalarenteapp://(owner)/
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/sign-out-owner.yaml

# ── TENANT: search card and detail show the photo; no tour -> coming soon ───
- runFlow: ../subflows/login-tenant.yaml
- openLink: lalarenteapp://(tenant)/search
- extendedWaitUntil:
    visible:
      id: "tenant-search-results"
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "tenant-search-card-image"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- takeScreenshot: lc10-tenant-search-photo
- waitForAnimationToEnd:
    timeout: 1500
- openLink: lalarenteapp://(tenant)/properties/${LC_PROPERTY_ID}
- extendedWaitUntil:
    visible:
      id: "tenant-property-photo"
    timeout: 25000
- takeScreenshot: lc10-tenant-detail-photo
- waitForAnimationToEnd:
    timeout: 1500
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "tenant-view-3d"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "tenant-view-3d"
- extendedWaitUntil:
    visible: "Feature coming soon"
    timeout: 15000
- tapOn:
    text: "OK"
- assertNotVisible:
    id: "view3d-close"
- openLink: lalarenteapp://(tenant)/
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/sign-out-tenant.yaml
