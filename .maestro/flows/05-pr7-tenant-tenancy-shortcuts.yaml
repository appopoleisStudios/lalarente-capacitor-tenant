# PR #7 — Your tenancy shortcuts (T9–T12 nav)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml
- runFlow: ../subflows/scroll-tenancy.yaml

- scrollUntilVisible:
    element: "Payments & arrears"
    direction: DOWN
    timeout: 15000

- tapOn: "Payments & arrears"
- extendedWaitUntil:
    visible: "Payment History"
    timeout: 15000
- back

- scrollUntilVisible:
    element: "Payment disputes"
    direction: DOWN
    timeout: 10000

- tapOn: "Payment disputes"
- extendedWaitUntil:
    visible: "Payment Disputes"
    timeout: 15000
- back

- scrollUntilVisible:
    element: "Holding deposits"
    direction: DOWN
    timeout: 10000

- tapOn: "Holding deposits"
- extendedWaitUntil:
    visible: "Holding Deposits"
    timeout: 15000
- back

- scrollUntilVisible:
    element: "Reports & inspections"
    direction: DOWN
    timeout: 10000

- tapOn: "Reports & inspections"
- extendedWaitUntil:
    visible: "Reports"
    timeout: 15000
