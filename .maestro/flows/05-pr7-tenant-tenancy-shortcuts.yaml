# PR #7 — Your tenancy shortcuts (T9–T13 nav) — client feedback closure
# Verifies shortcuts exist on dashboard when tenant has active lease.
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

- extendedWaitUntil:
    visible: "Current Home"
    timeout: 90000
    optional: true

- scrollUntilVisible:
    element: "Payments & arrears"
    direction: DOWN
    timeout: 90000

- scrollUntilVisible:
    element: "Payment disputes"
    direction: DOWN
    timeout: 45000

- scrollUntilVisible:
    element: "Arrears & escalation"
    direction: DOWN
    timeout: 45000

- scrollUntilVisible:
    element: "Early termination"
    direction: DOWN
    timeout: 45000

- scrollUntilVisible:
    element: "Holding deposits"
    direction: DOWN
    timeout: 45000

- scrollUntilVisible:
    element: "Reports & inspections"
    direction: DOWN
    timeout: 45000
