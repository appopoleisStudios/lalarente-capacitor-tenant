# PR #7 — Your tenancy shortcuts (T9–T13 nav) — client feedback closure
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/payments
- extendedWaitUntil:
    visible:
      id: "tab-payments"
    timeout: 30000

- assertVisible:
    text: "Payments"
    optional: true
- assertVisible:
    text: "No Active Lease"
    optional: true

- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/payment-disputes
- extendedWaitUntil:
    visible:
      id: "payment-disputes-title"
    timeout: 45000

- assertVisible:
    text: "No payment disputes"
    optional: true

- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/holding-deposit
- extendedWaitUntil:
    visible: "Holding Deposits"
    timeout: 30000
    optional: true
- assertVisible:
    text: "No Holding Deposits"
    optional: true

- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/arrears
- extendedWaitUntil:
    visible: "My Arrears"
    timeout: 30000
    optional: true
- assertVisible:
    text: "No Active Lease"
    optional: true

- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/early-termination
- extendedWaitUntil:
    visible: "Early Termination"
    timeout: 30000

- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/reports
- extendedWaitUntil:
    visible: "Reports"
    timeout: 30000
