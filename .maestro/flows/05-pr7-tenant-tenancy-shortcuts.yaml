# PR #7 — Your tenancy shortcuts (T9–T13 nav) — client feedback closure
# Deep-link each destination (reliable on iOS 26; dashboard scroll is flaky below the fold).
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/payments
- extendedWaitUntil:
    visible: "Payments"
    timeout: 20000

- openLink: lalarenteapp:///(tenant)/payment-disputes
- extendedWaitUntil:
    visible: "Payment Disputes"
    timeout: 20000

- openLink: lalarenteapp:///(tenant)/holding-deposit
- extendedWaitUntil:
    visible: "Holding Deposits"
    timeout: 20000

- openLink: lalarenteapp:///(tenant)/arrears
- extendedWaitUntil:
    visible: "My Arrears"
    timeout: 20000

- openLink: lalarenteapp:///(tenant)/early-termination
- extendedWaitUntil:
    visible: "Early Termination"
    timeout: 20000

- openLink: lalarenteapp:///(tenant)/reports
- extendedWaitUntil:
    visible: "Reports"
    timeout: 20000
