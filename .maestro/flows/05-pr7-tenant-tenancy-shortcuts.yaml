# PR #7 — Your tenancy shortcuts (T9–T13 nav) — client feedback closure
# Verifies shortcuts exist on dashboard when tenant has active lease.
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

- scrollUntilVisible:
    element:
      id: "tenancy-payments-arrears"
    direction: DOWN
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "tenancy-payment-disputes"
    direction: DOWN
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "tenancy-arrears-escalation"
    direction: DOWN
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "tenancy-early-termination"
    direction: DOWN
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "tenancy-holding-deposits"
    direction: DOWN
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "tenancy-reports-inspections"
    direction: DOWN
    timeout: 10000
