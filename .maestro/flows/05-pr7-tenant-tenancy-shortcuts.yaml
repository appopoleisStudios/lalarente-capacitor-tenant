# PR #7 — Your tenancy shortcuts (T9–T12 nav)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml
- runFlow: ../subflows/scroll-tenancy.yaml

- scrollUntilVisible:
    element:
      id: "tenancy-payments-arrears"
    direction: DOWN
    timeout: 15000

- tapOn:
    id: "tenancy-payments-arrears"
- extendedWaitUntil:
    visible: "Payment History"
    timeout: 20000
- back

- scrollUntilVisible:
    element:
      id: "tenancy-payment-disputes"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "tenancy-payment-disputes"
- extendedWaitUntil:
    visible: "Payment Disputes"
    timeout: 15000
- back

- scrollUntilVisible:
    element:
      id: "tenancy-holding-deposits"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "tenancy-holding-deposits"
- extendedWaitUntil:
    visible: "Holding Deposits"
    timeout: 15000
- back

- scrollUntilVisible:
    element:
      id: "tenancy-reports-inspections"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "tenancy-reports-inspections"
- extendedWaitUntil:
    visible: "Reports"
    timeout: 15000
