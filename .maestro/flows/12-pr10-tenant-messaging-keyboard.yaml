# PR #10 — Messaging thread keyboard / input visible (S2-10, S2-15)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/open-tenant-messages.yaml

- assertVisible:
    text: "No Messages"
    optional: true

- tapOn:
    point: "50%,45%"
    optional: true

- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 15000
    optional: true

- extendedWaitUntil:
    visible: "Type a message"
    timeout: 15000
    optional: true

- runFlow:
    when:
      visible: "Type a message..."
    commands:
      - tapOn: "Type a message..."
      - inputText: "QA keyboard visibility check"
      - pressKey: Enter
      - assertVisible:
          text: "QA keyboard visibility check"
          optional: true

- assertVisible:
    id: "tenant-messages-title"
