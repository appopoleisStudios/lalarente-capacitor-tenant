# PR #10 — Messaging thread keyboard / input visible (S2-10, S2-15)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml
- runFlow: ../subflows/open-tenant-messages.yaml

- tapOn:
    point: "50%,45%"
    optional: true

- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 20000

- tapOn:
    text: "Type a message..."
    optional: true

- inputText: "QA keyboard visibility check"
- pressKey: Enter

- assertVisible:
    text: "QA keyboard visibility check"
    optional: true
