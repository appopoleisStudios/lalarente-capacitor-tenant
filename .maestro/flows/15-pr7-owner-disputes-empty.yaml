# PR #7 — Owner payment disputes empty state
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-owner.yaml

- openLink: lalarenteapp:///(owner)/payment-disputes

- extendedWaitUntil:
    visible: "Payment Disputes"
    timeout: 20000

- assertVisible:
    text: "No payment disputes yet"
    optional: true
