# PR #7 — Application upload screen shows PDF-only proof-of-income section
# Needs a tenant who can still apply (no blocking application on chosen property).
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/search

- extendedWaitUntil:
    visible: "Search by location"
    timeout: 20000

- extendedWaitUntil:
    visible: "found"
    timeout: 20000
    optional: true

- tapOn:
    point: "50%,55%"
    optional: true

- extendedWaitUntil:
    visible: "Apply Now"
    timeout: 10000
    optional: true

- tapOn:
    text: "Apply Now"
    optional: true

- extendedWaitUntil:
    visible: "Upload Documents"
    timeout: 15000
    optional: true

- assertVisible:
    text: "Proof of Income"
    optional: true
