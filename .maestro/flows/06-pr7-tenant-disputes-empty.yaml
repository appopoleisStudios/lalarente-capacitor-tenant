# PR #7 — Payment dispute empty-state copy
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

- scrollUntilVisible:
    element:
      id: "tenancy-payment-disputes"
    direction: DOWN
    timeout: 60000

- tapOn:
    id: "tenancy-payment-disputes"
- assertVisible: "Payment Disputes"
- assertVisible:
    text: "No payment disputes"
    optional: true
