# PR #9 — Completed inspection opens read-only detail (not conduct checklist)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-owner.yaml

- openLink: lalarenteapp:///(owner)/inspections

- extendedWaitUntil:
    visible: "Inspections"
    timeout: 20000

- tapOn:
    text: "Completed"
    optional: true

- tapOn:
    text: "Move-In"
    optional: true

- tapOn:
    text: "completed"
    optional: true

- extendedWaitUntil:
    visible: "Completed"
    timeout: 15000
    optional: true

- assertNotVisible:
    text: "Room 1 of"
    optional: true

- assertVisible: "Inspections"
