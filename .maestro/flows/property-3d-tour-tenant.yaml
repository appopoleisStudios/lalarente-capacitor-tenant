# Tenant 3D tour (LAL-133)
# Home "Current Home" CTA if the leased property has media_3d_url.
# Else Search: type a known listing, open the first card, open the detail CTA.
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

- runFlow:
    when:
      visible:
        id: "tenant-view-3d"
    commands:
      - tapOn:
          id: "tenant-view-3d"
      - extendedWaitUntil:
          visible:
            id: "view3d-title"
          timeout: 15000
      - tapOn:
          id: "view3d-close"
      - assertNotVisible:
          id: "view3d-close"

- runFlow:
    when:
      notVisible:
        id: "tenant-view-3d"
    commands:
      - tapOn:
          id: "tab-search"
      - extendedWaitUntil:
          visible:
            id: "tenant-search-results"
          timeout: 30000
      - tapOn:
          id: "tenant-search-input"
      - eraseText
      - inputText: "Ocean"
      - extendedWaitUntil:
          visible:
            id: "tenant-property-card"
          timeout: 20000
          optional: true
      - tapOn:
          id: "tenant-property-card"
          optional: true
      - extendedWaitUntil:
          visible: "View in 3D"
          timeout: 15000
          optional: true
      - scrollUntilVisible:
          element:
            id: "tenant-view-3d"
          direction: DOWN
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible:
              id: "tenant-view-3d"
          commands:
            - tapOn:
                id: "tenant-view-3d"
            - extendedWaitUntil:
                visible:
                  id: "view3d-title"
                timeout: 15000
            - tapOn:
                id: "view3d-close"
            - assertNotVisible:
                id: "view3d-close"
