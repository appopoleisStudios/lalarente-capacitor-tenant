# Parity — Maintenance surface visibility (tenant → owner → vendor)
# Scope (what this flow verifies):
#   1. Tenant can create a maintenance request with a unique token
#   2. The request is visible to the owner in their maintenance list
#   3. The request is visible to an eligible vendor in their Requests tab
# Out of scope (deferred to a fixture-seeded flow):
#   - Owner-to-vendor assignment propagation
#   - Vendor quote submission → owner PO approval
#   - Vendor closure request → tenant verification → owner close
# Env: TENANT/OWNER/VENDOR creds + REQ_TOKEN
appId: com.lalarente.app
---

# ────────────────────────────────────────────────────────────
# PHASE 1 — Tenant reports maintenance request
# ────────────────────────────────────────────────────────────
- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp://(tenant)/maintenance/report
- extendedWaitUntil:
    visible: "Report Issue"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: parity-02a-tenant-report-opened

# Fill the title via its testID (regex on "Title" label hit the field
# header, not the input, and the submit then triggered a Required alert).
- extendedWaitUntil:
    visible:
      id: "maintenance-title-input"
    timeout: 10000
- tapOn:
    id: "maintenance-title-input"
- inputText: "UAT-${REQ_TOKEN}"
- tapOn:
    point: "50%,8%"

# Description via its testID
- extendedWaitUntil:
    visible:
      id: "maintenance-description-input"
    timeout: 10000
- tapOn:
    id: "maintenance-description-input"
- inputText: "Parity maintenance ping ${REQ_TOKEN}"
- tapOn:
    point: "50%,8%"

# Submit — scrollUntilVisible with permissive visibility first (bring
# into view on small screens), then extendedWaitUntil to confirm. The
# visibility: 50 setting avoids the tab-bar overlap that broke the
# default 100% rule.
- scrollUntilVisible:
    element:
      id: "maintenance-submit"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- extendedWaitUntil:
    visible:
      id: "maintenance-submit"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "maintenance-submit"
- waitForAnimationToEnd:
    timeout: 4000
# Submission success: we leave the Report Issue screen and land on the
# maintenance list where the just-created request is visible by token.
- extendedWaitUntil:
    notVisible: "Report Issue"
    timeout: 10000
- takeScreenshot: parity-02a-tenant-submitted

- runFlow: ../subflows/sign-out-tenant.yaml

# ────────────────────────────────────────────────────────────
# PHASE 2 — Owner sees the request in their maintenance list
# ────────────────────────────────────────────────────────────
- runFlow: ../subflows/login-owner.yaml

- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "tab-owner-maintenance"
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000

# Owner must see the tenant's UAT request by token
- scrollUntilVisible:
    element:
      text: ".*UAT-${REQ_TOKEN}.*"
    direction: DOWN
    timeout: 25000
    centerElement: true
- assertVisible:
    text: ".*UAT-${REQ_TOKEN}.*"
- takeScreenshot: parity-02b-owner-sees-request

- runFlow: ../subflows/sign-out-owner.yaml

# ────────────────────────────────────────────────────────────
# PHASE 3 — Vendor sees the request in their Requests tab
# ────────────────────────────────────────────────────────────
- runFlow: ../subflows/login-vendor.yaml

- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "tab-vendor-requests"
- extendedWaitUntil:
    visible: "Maintenance Requests"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: parity-02c-vendor-requests-list

# Vendor must see the tenant's new request by token. Visibility failure
# here means the request isn't rendered in this vendor's list — possible
# causes include fixture mismatch (vendor categories don't match request
# category), RLS, pagination/filter state, or UI load failure.
- scrollUntilVisible:
    element:
      text: ".*UAT-${REQ_TOKEN}.*"
    direction: DOWN
    timeout: 25000
    centerElement: true
- assertVisible:
    text: ".*UAT-${REQ_TOKEN}.*"
- takeScreenshot: parity-02c-vendor-sees-request

- runFlow: ../subflows/sign-out-vendor.yaml
