# Vendor Payment Flow - E2E Test
# Verifies the tenant money path: approved tenant-payer invoices are visible and
# the tenant can navigate to the PayFast payment screen.
#
# Prerequisites:
#   - Run scripts/seed-tenant-vendor-invoice.mjs first (creates an APPROVED
#     tenant-payer invoice linked to the tenant's latest maintenance request).
#     The tenant screen only lists payer_role='tenant' + status='approved'
#     invoices, so the seed must run before this flow.
#   - Uses the in-app entry point (qa-vendor-payments quick action on the tenant
#     dashboard) instead of the fragile deep link.
#   - Selectors use testIDs (not raw text) on icon+text buttons to avoid the
#     icon-prefix matching bug (Maestro merges icon name into accessibility text).
#   - This is a device smoke test, not a CI gate: it verifies navigation + UI,
#     not a live PayFast transaction (sandbox browser flow is manual).
appId: com.lalarente.app
---
- runFlow: ../subflows/login-tenant.yaml

# Navigate to vendor payments via the dashboard Quick Action (in-app entry point)
- scrollUntilVisible:
    element:
      id: "qa-vendor-payments"
    direction: DOWN
    timeout: 20000
    centerElement: true

- tapOn:
    id: "qa-vendor-payments"

# Wait for the vendor payments screen header
- extendedWaitUntil:
    visible:
      id: "vendor-payments-title"
    timeout: 30000

# The seeded invoice must be present — REQUIRED (a missing seed means the money
# path can't be verified, so fail loudly instead of silently passing).
- extendedWaitUntil:
    visible:
      id: "invoice-number"
    timeout: 15000

# Verify Pay Now button exists and tap it (testID — button contains an icon)
- assertVisible:
    id: "pay-now"
- tapOn:
    id: "pay-now"

# Wait for the Pay Vendor detail screen
- extendedWaitUntil:
    visible:
      id: "pay-vendor-title"
    timeout: 15000

# Verify invoice detail elements
- assertVisible:
    id: "invoice-number-detail"
- assertVisible:
    id: "pay-via-payfast"
- assertVisible:
    text: "Invoice Breakdown"
    optional: true
- assertVisible:
    text: "Secure Payment via PayFast"
    optional: true

# Navigate back without completing payment
- tapOn:
    text: "Cancel and go back"
    optional: true

# ✅ E2E vendor payment flow verification complete
