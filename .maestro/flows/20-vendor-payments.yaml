appId: com.lalarente.app
---
# Vendor Payment Flow - E2E Test
# Verifies tenant can see approved vendor invoices and navigate to payment screen

# Warm launch first, then login (same pattern as working flows)
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

# Navigate to vendor payments via deep link
- openLink: lalarenteapp:///(tenant)/vendor-payments

# Wait for the vendor payments screen header to appear
- extendedWaitUntil:
    visible: "Vendor Payments"
    timeout: 30000

# Wait for invoices to load - we should see INV-2026-001
- extendedWaitUntil:
    visible: "INV-2026-001"
    timeout: 20000

# Verify the invoice card is visible with the amount
- assertVisible:
    text: "R 1"
    optional: true

# Verify the Pay Now button exists
- assertVisible:
    text: "Pay Now"
    optional: true

# Tap Pay Now to go to the invoice detail screen
- tapOn:
    text: "Pay Now"

# Wait for the detail screen to load
- extendedWaitUntil:
    visible: "Pay Vendor"
    timeout: 15000

# Verify invoice number is shown
- assertVisible:
    text: "INV-2026-001"
    optional: true

# Verify Pay via PayFast button exists
- assertVisible:
    text: "Pay via PayFast"
    optional: true

# Verify invoice breakdown is visible
- assertVisible:
    text: "Invoice Breakdown"
    optional: true

# Verify secure payment info is shown
- assertVisible:
    text: "Secure Payment via PayFast"
    optional: true

# Navigate back to list
- tapOn:
    text: "Cancel and go back"

# Verify we're back on the list
- extendedWaitUntil:
    visible: "Vendor Payments"
    timeout: 10000

# ✅ E2E vendor payment flow verification complete
