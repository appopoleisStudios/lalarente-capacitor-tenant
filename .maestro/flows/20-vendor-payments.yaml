appId: com.lalarente.app
---
# Vendor Payment Flow - E2E Test
# Verifies tenant can see approved vendor invoices and navigate to payment screen
# Uses standard login subflows for reliable authentication

# Use standard warm launch + login instead of fragile inline login
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

# Now on dashboard — navigate to vendor payments via deep link
- openLink: lalarenteapp:///(tenant)/vendor-payments

# Wait for the vendor payments screen header
- extendedWaitUntil:
    visible: "Vendor Payments"
    timeout: 30000

# Wait for invoice data to load
- extendedWaitUntil:
    visible: "INV-2026-001"
    timeout: 20000
    optional: true

# Verify Pay Now button exists and tap it
- assertVisible:
    text: "Pay Now"
    optional: true
- tapOn:
    text: "Pay Now"
    optional: true

# Wait for the detail screen to load
- extendedWaitUntil:
    visible: "Pay Vendor"
    timeout: 15000

# Verify invoice detail elements
- assertVisible:
    text: "INV-2026-001"
    optional: true
- assertVisible:
    text: "Pay via PayFast"
- assertVisible:
    text: "Invoice Breakdown"
    optional: true
- assertVisible:
    text: "Secure Payment via PayFast"
    optional: true

# Navigate back
- tapOn:
    text: "Cancel and go back"
    optional: true

# ✅ E2E vendor payment flow verification complete
