appId: com.lalarente.app
---
# Vendor Payment Flow - E2E Test (Self-contained, text-based selectors)
# Verifies tenant can see approved vendor invoices and navigate to payment screen
# Uses text selectors throughout for compatibility with stale simulator build

# App was just warmed up (terminated then launched) by warm-e2e-simulator.sh
# Maestro just launches it fresh — stopApp is not needed and may interfere
- launchApp

# Wait for the app to finish loading — look for any known element
- extendedWaitUntil:
    visible: "Lalarente"
    timeout: 60000

# Confirm we're on the login screen
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 15000

# Login as tenant
# Tap email field by placeholder
- tapOn: "your@email.com"
- inputText: ${TENANT_EMAIL}
- pressKey: Enter

# Tap password field by placeholder (may be gone if field auto-focused, but try anyway)
- tapOn:
    text: "Enter your password"
    optional: true
- inputText: ${TENANT_PASSWORD}
- pressKey: Enter

# Wait for dashboard to appear
- extendedWaitUntil:
    visible: "Payments"
    timeout: 60000
    optional: true

# Fallback: try tapping Sign In explicitly
- runFlow:
    when:
      notVisible: "Payments"
    commands:
      - tapOn:
          text: "Sign In"
          optional: true
      - extendedWaitUntil:
          visible: "Payments"
          timeout: 60000

# Navigate to vendor payments via deep link
- openLink: lalarenteapp:///(tenant)/vendor-payments

# Wait for the vendor payments screen header
- extendedWaitUntil:
    visible: "Vendor Payments"
    timeout: 30000

# Wait for invoice data to load - look for the approved invoice
- extendedWaitUntil:
    visible: "INV-2026-001"
    timeout: 20000
    optional: true

# Verify Pay Now button exists
- assertVisible:
    text: "Pay Now"
    optional: true

# Tap Pay Now to go to the invoice detail screen
- tapOn:
    text: "Pay Now"
    optional: true

# Wait for the detail screen to load
- extendedWaitUntil:
    visible: "Pay Vendor"
    timeout: 15000

# Verify invoice number is shown
- assertVisible:
    text: "INV-2026-001"
    optional: true

# Verify Pay via PayFast button exists
- assertVisible:
    text: "Pay via PayFast"

# Verify invoice breakdown is visible
- assertVisible:
    text: "Invoice Breakdown"
    optional: true

# Verify secure payment info is shown
- assertVisible:
    text: "Secure Payment via PayFast"
    optional: true

# Navigate back
- tapOn:
    text: "Cancel and go back"
    optional: true

# ✅ E2E vendor payment flow verification complete
