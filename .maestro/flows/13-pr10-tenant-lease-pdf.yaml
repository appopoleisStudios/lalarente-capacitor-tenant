# PR #10 — Lease screen + PDF download affordance (S2-24)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "view-lease-details"
    direction: DOWN
    timeout: 25000

- tapOn:
    id: "view-lease-details"
- assertVisible: "My Lease"

- scrollUntilVisible:
    element:
      text: "Lease Document"
    direction: DOWN
    timeout: 25000

- assertVisible: "Lease Document"
- assertVisible:
    text: "Download PDF"
    optional: true
