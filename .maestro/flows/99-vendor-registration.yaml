# === VENDOR E2E LOGIN — test that an existing vendor can log in and lands on dashboard
# Uses VENDOR_EMAIL/VENDOR_PASSWORD from .maestro/.env (passed via --env flags).
# The e2e-vendor@lalarente.com account must already exist with role=vendor.
# login-vendor handles session clearing (clearKeychain + role-aware UI sign-out).
appId: com.lalarente.app
---
# === LOGIN WITH EXISTING VENDOR (handles cached-session clearing) ===
- runFlow: ../subflows/login-vendor.yaml

# === VERIFY DASHBOARD ELEMENTS ===
# Stat card labels are icon-prefixed ("<icon>, Available") — use .*regex
- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 30000

- assertVisible:
    text: ".*Available.*"
    optional: true
- assertVisible:
    text: ".*Active.*"
    optional: true
- assertVisible:
    text: ".*Completed.*"
    optional: true
