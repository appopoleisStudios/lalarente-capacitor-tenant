# Lifecycle error-state sweep — every lifecycle screen opened by id, with an
# id that does not exist, shows its error state and its Retry / Go Back works.
# Independent of the chain; run any time.
# Not covered here (only reachable on a network failure, not a bad id):
# Retry on Search, My Lease, Lease Journey and the owner Applications list.
# Env: creds
appId: com.lalarente.app
---
# ── OWNER ─────────────────────────────────────────────────────────────────
- runFlow: ../subflows/login-owner.yaml
- openLink: lalarenteapp://(owner)/applications/00000000-0000-0000-0000-000000000000
- extendedWaitUntil:
    visible: ".*(Application not found|Failed to load application|Cannot coerce|JSON object).*"
    timeout: 25000
- tapOn:
    id: "owner-application-retry"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "owner-application-retry"
    timeout: 25000
- assertVisible: ".*(Application not found|Failed to load application|Cannot coerce|JSON object).*"
- openLink: lalarenteapp://(owner)/leases/00000000-0000-0000-0000-000000000000
- extendedWaitUntil:
    visible: ".*(Failed to load lease|Cannot coerce|JSON object).*"
    timeout: 25000
- tapOn:
    id: "owner-lease-retry"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "owner-lease-retry"
    timeout: 25000
- assertVisible: ".*(Failed to load lease|Cannot coerce|JSON object).*"
- openLink: lalarenteapp://(owner)/inspections/00000000-0000-0000-0000-000000000000
- extendedWaitUntil:
    visible: "Inspection not found"
    timeout: 25000
- tapOn:
    id: "owner-inspection-retry"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "owner-inspection-retry"
    timeout: 25000
- assertVisible: "Inspection not found"
- openLink: lalarenteapp://(owner)/leases/create?applicationId=00000000-0000-0000-0000-000000000000
- extendedWaitUntil:
    visible: "Application not found"
    timeout: 25000
- tapOn:
    id: "owner-lease-create-go-back"
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible: "Application not found"
- openLink: lalarenteapp://(owner)/maintenance/00000000-0000-0000-0000-000000000000
- extendedWaitUntil:
    visible: "Failed to load request details"
    timeout: 25000
- tapOn:
    text: "OK"
- extendedWaitUntil:
    visible: "Request not found"
    timeout: 25000
- tapOn:
    id: "owner-maintenance-detail-go-back"
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible: "Request not found"
- openLink: lalarenteapp://(owner)/maintenance/00000000-0000-0000-0000-000000000000/quote/00000000-0000-0000-0000-000000000000
- extendedWaitUntil:
    visible: "Failed to load quote details"
    timeout: 25000
- tapOn:
    text: "OK"
- extendedWaitUntil:
    visible: "Quote not found"
    timeout: 25000
- tapOn:
    id: "owner-quote-go-back"
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible: "Quote not found"
- takeScreenshot: lc09-owner-error-states
- waitForAnimationToEnd:
    timeout: 1500
- openLink: lalarenteapp://(owner)/
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/sign-out-owner.yaml

# ── TENANT ────────────────────────────────────────────────────────────────
- runFlow: ../subflows/login-tenant.yaml
- openLink: lalarenteapp://(tenant)/properties/00000000-0000-0000-0000-000000000000
- extendedWaitUntil:
    visible: ".*(Property not found|no longer available|Failed to load property|Cannot coerce|JSON object).*"
    timeout: 25000
- tapOn:
    id: "tenant-property-retry"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "tenant-property-retry"
    timeout: 25000
- assertVisible: ".*(Property not found|no longer available|Failed to load property|Cannot coerce|JSON object).*"
- openLink: lalarenteapp://(tenant)/applications/00000000-0000-0000-0000-000000000000
- extendedWaitUntil:
    visible: ".*(Application not found|Failed to load application|Cannot coerce|JSON object).*"
    timeout: 25000
- tapOn:
    id: "tenant-application-retry"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "tenant-application-retry"
    timeout: 25000
- assertVisible: ".*(Application not found|Failed to load application|Cannot coerce|JSON object).*"
- openLink: lalarenteapp://(tenant)/inspections/00000000-0000-0000-0000-000000000000
- extendedWaitUntil:
    visible: ".*(Inspection not found|Failed to load inspection|Cannot coerce|JSON object).*"
    timeout: 25000
- tapOn:
    id: "inspection-retry"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "inspection-retry"
    timeout: 25000
- assertVisible: ".*(Inspection not found|Failed to load inspection|Cannot coerce|JSON object).*"
- openLink: lalarenteapp://(tenant)/maintenance/00000000-0000-0000-0000-000000000000
- extendedWaitUntil:
    visible: "Request Not Found"
    timeout: 25000
- tapOn:
    id: "tenant-maintenance-detail-go-back"
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible: "Request Not Found"

# ── closure confirm without a job id: header back and Go Back ─────────────
- openLink: lalarenteapp://(tenant)/maintenance/closure-confirm
- extendedWaitUntil:
    visible:
      id: "closure-confirm-go-back"
    timeout: 25000
- tapOn:
    id: "closure-confirm-back"
- waitForAnimationToEnd:
    timeout: 2000
- openLink: lalarenteapp://(tenant)/maintenance/closure-confirm
- extendedWaitUntil:
    visible:
      id: "closure-confirm-go-back"
    timeout: 25000
- tapOn:
    id: "closure-confirm-go-back"
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible:
    id: "closure-confirm-go-back"

# ── verification link without a job id ────────────────────────────────────
- openLink: lalarenteapp://(tenant)/maintenance/verify
- extendedWaitUntil:
    visible:
      id: "tenant-verify-error"
    timeout: 25000
- assertVisible: "Verification link incomplete"
- tapOn:
    text: "Go Back"
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible:
    id: "tenant-verify-error"
- takeScreenshot: lc09-tenant-error-states
- waitForAnimationToEnd:
    timeout: 1500
- openLink: lalarenteapp://(tenant)/
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/sign-out-tenant.yaml
