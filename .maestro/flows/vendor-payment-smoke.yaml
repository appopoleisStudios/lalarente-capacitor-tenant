# Vendor Payment Smoke Test — Tenant Happy Path
# Verifies: vendor-payments list loads → invoice detail renders → pay screen accessible
# Does NOT: process a real PayFast payment (requires sandbox credentials)
appId: com.lalarente.app
env:
  VENDOR_PAYMENT_INVOICE_ID: ""
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml

# Navigate to Vendor Payments from maintenance
- openLink: lalarenteapp:///(tenant)/vendor-payments
- extendedWaitUntil:
    visible: "Vendor Payments"
    timeout: 15000

# Verify the list screen loaded
- assertVisible: "Pay for completed maintenance work"

# Wait for invoices to load
- extendedWaitUntil:
    notVisible: "ActivityIndicator"
    timeout: 15000
    optional: true

# Check if there are pending invoices
- runFlow:
    when:
      visible: "Pay Now"
    commands:
      # Tap Pay Now on the first invoice
      - tapOn:
          text: "Pay Now"
          index: 0

      # Wait for invoice detail screen
      - extendedWaitUntil:
          visible: "Pay Vendor"
          timeout: 15000

      # Verify invoice breakdown is visible
      - assertVisible: "Invoice Breakdown"
      - assertVisible: "Secure Payment via PayFast"
      - assertVisible: "Pay via PayFast"

      # Navigate back
      - tapOn:
          point: "10%,6%"
      - extendedWaitUntil:
          visible: "Vendor Payments"
          timeout: 10000

# If no invoices, the empty state should show
- runFlow:
    when:
      visible: "No Pending Payments"
    commands:
      - assertVisible: "You have no approved vendor invoices awaiting payment"
      - assertVisible: "back"  # Back navigation should be available
