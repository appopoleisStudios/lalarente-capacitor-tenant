# ── Done ─────────────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-home"
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 30000
- takeScreenshot: uat-owner-99-done

# Sign out so the next UAT role starts on the login screen
- runFlow: ../subflows/sign-out-owner.yaml
