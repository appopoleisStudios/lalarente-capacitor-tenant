# UAT — Owner full journey (Navin Indraj / indraj.navin@gmail.com)
# Covers every tab and major screen as a real landlord would use the app.
# Run with: maestro test .maestro/flows/uat-owner-full.yaml \
#             --env OWNER_EMAIL=indraj.navin@gmail.com \
#             --env OWNER_PASSWORD=Nadene10_
appId: com.lalarente.app
---
- runFlow: ../subflows/login-owner.yaml

# ── 1. Dashboard — portfolio stats ───────────────────────────────────────────
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 60000
- assertVisible:
    text: "Portfolio Dashboard"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: uat-owner-01-dashboard

# ── 2. Properties tab ────────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-properties"
- extendedWaitUntil:
    visible: "Properties"
    timeout: 20000
- assertVisible:
    text: "Properties"
- takeScreenshot: uat-owner-02-properties

# ── 3. Maintenance tab ───────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-maintenance"
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000
- assertVisible:
    text: "Maintenance"
- takeScreenshot: uat-owner-03-maintenance

# ── 4. Tenants tab ───────────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-tenants"
- extendedWaitUntil:
    visible: "Tenants"
    timeout: 20000
- assertVisible:
    text: "Tenants"
- takeScreenshot: uat-owner-04-tenants

# ── 5. Profile tab ───────────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-profile"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 20000
- assertVisible:
    text: "Profile"
- takeScreenshot: uat-owner-05-profile

# ── 6. Lala AI tab ───────────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-lala-ai"
- extendedWaitUntil:
    visible: "Lala Assistant"
    timeout: 20000
- assertVisible: "Lala Assistant"
- extendedWaitUntil:
    visible:
      id: "lala-chip-0"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "lala-chip-0"
    commands:
      - tapOn:
          id: "lala-chip-0"
      - extendedWaitUntil:
          notVisible: "Lala is typing..."
          timeout: 45000
- takeScreenshot: uat-owner-06-lala-ai

# ── 7. Messages (header button) ──────────────────────────────────────────────
- tapOn:
    id: "tab-owner-home"
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "owner-messages-button"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "owner-messages-title"
    timeout: 15000
- assertVisible:
    text: "No Messages"
    optional: true
- takeScreenshot: uat-owner-07-messages

# Compose new message
- openLink: lalarenteapp://(owner)/messages/new
- extendedWaitUntil:
    notVisible: "This screen doesn't exist."
    timeout: 10000
    optional: true
- takeScreenshot: uat-owner-08-messages-compose
- back

# ── 8. Notifications ─────────────────────────────────────────────────────────
- openLink: lalarenteapp://(owner)/notifications
- extendedWaitUntil:
    notVisible: "This screen doesn't exist."
    timeout: 10000
    optional: true
- assertVisible:
    text: "Notifications"
    optional: true
- takeScreenshot: uat-owner-09-notifications
- back

