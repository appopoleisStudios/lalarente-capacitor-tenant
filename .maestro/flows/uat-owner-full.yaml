# ── 26. Maintenance — archive/unarchive round-trip ───────────────────────────
- tapOn:
    id: "tab-owner-maintenance"
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000
- tapOn:
    text: "All"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: "All"
- takeScreenshot: uat-owner-27-maintenance-all

# Hard precondition: Archived must be empty so index: 0 after archiving is
# unambiguously the request we moved, not a pre-existing archived record.
- tapOn:
    text: "Archived"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: "Nothing archived"
- takeScreenshot: uat-owner-27-archived-precondition-empty

# Return to All; run archive round-trip only when at least one active card exists.
# (Skips gracefully on an empty account; all inner assertions are mandatory once entered.)
- tapOn:
    text: "All"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible:
        id: "maintenance-card"
    commands:
      # Archive the first card from the active list
      - longPressOn:
          id: "maintenance-card"
          index: 0
      - tapOn:
          text: "Archive"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: uat-owner-27a-all-after-archive
      # Switch to Archived — precondition was empty, so this card is the only one
      - tapOn:
          text: "Archived"
      - waitForAnimationToEnd:
          timeout: 2000
      # Mandatory: Archived must show the card (proves it left the active list)
      - assertNotVisible:
          text: "Nothing archived"
      - assertVisible:
          id: "maintenance-card"
          index: 0
      - takeScreenshot: uat-owner-27b-card-in-archived
      # Unarchive — index 0 is unambiguously the request we just archived
      - longPressOn:
          id: "maintenance-card"
          index: 0
      - tapOn:
          text: "Unarchive"
      - waitForAnimationToEnd:
          timeout: 3000
      # Mandatory: Archived must be empty again (proves unarchive moved the card out)
      - assertVisible:
          text: "Nothing archived"
      - takeScreenshot: uat-owner-27c-archived-empty-after-unarchive
      # Return to All — card must be restored
      - tapOn:
          text: "All"
      - waitForAnimationToEnd:
          timeout: 2000
      - assertVisible:
          id: "maintenance-card"
          index: 0
      - takeScreenshot: uat-owner-27d-card-restored-to-all

# ── Done ─────────────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-home"
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 30000
- takeScreenshot: uat-owner-99-done

# Sign out so the next UAT role starts on the login screen
- runFlow: ../subflows/sign-out-owner.yaml
