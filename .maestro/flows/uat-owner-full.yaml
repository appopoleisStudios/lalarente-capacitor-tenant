# UAT — Owner full journey
# Covers every tab and major screen as a real landlord would use the app.
# Run with: maestro test .maestro/flows/uat-owner-full.yaml \
#             --env OWNER_EMAIL=<owner-email> \
#             --env OWNER_PASSWORD=<owner-password>
appId: com.lalarente.app
---
- runFlow: ../subflows/login-owner.yaml

# ── 1. Dashboard — portfolio stats ───────────────────────────────────────────
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 60000
- assertVisible:
    text: "Portfolio Dashboard"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: uat-owner-01-dashboard

# ── 2. Properties tab ────────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-properties"
- extendedWaitUntil:
    visible: "Properties"
    timeout: 20000
- assertVisible:
    text: "Properties"
- takeScreenshot: uat-owner-02-properties

# ── 3. Maintenance tab ───────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-maintenance"
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000
- assertVisible:
    text: "Maintenance"
- takeScreenshot: uat-owner-03-maintenance

# ── 4. Tenants tab ───────────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-tenants"
- extendedWaitUntil:
    visible: "Tenants"
    timeout: 20000
- assertVisible:
    text: "Tenants"
- takeScreenshot: uat-owner-04-tenants

# ── 5. Profile tab ───────────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-profile"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 20000
- assertVisible:
    text: "Profile"
- takeScreenshot: uat-owner-05-profile

# ── 6. Lala AI tab ───────────────────────────────────────────────────────────
- tapOn:
    id: "tab-owner-lala-ai"
- extendedWaitUntil:
    visible: "Lala Assistant"
    timeout: 20000
- assertVisible: "Lala Assistant"
# Clear any prior conversation so the chip interaction produces a fresh response
- runFlow:
    when:
      visible:
        id: "lala-new-chat"
    commands:
      - tapOn:
          id: "lala-new-chat"
      - waitForAnimationToEnd:
          timeout: 1000
# Chips only render on empty state — assert no existing AI message before tapping
- assertNotVisible:
    id: "lala-ai-message"
- extendedWaitUntil:
    visible:
      id: "lala-chip-0"
    timeout: 15000
- tapOn:
    id: "lala-chip-0"
- extendedWaitUntil:
    visible:
      id: "lala-ai-message"
    timeout: 60000
- assertNotVisible:
    id: "lala-error-row"
- takeScreenshot: uat-owner-06-lala-ai

# ── 7. Messages (header button) ──────────────────────────────────────────────
- tapOn:
    id: "tab-owner-home"
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "owner-messages-button"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "owner-messages-title"
    timeout: 15000
- assertVisible:
    text: "No Messages"
    optional: true
- takeScreenshot: uat-owner-07-messages

# Compose new message
- openLink: lalarenteapp://(owner)/messages/new
- extendedWaitUntil:
    visible: "New Message"
    timeout: 15000
- assertVisible:
    text: "New Message"
- takeScreenshot: uat-owner-08-messages-compose
- back

# ── 8. Notifications ─────────────────────────────────────────────────────────
- openLink: lalarenteapp://(owner)/notifications
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 15000
- assertVisible:
