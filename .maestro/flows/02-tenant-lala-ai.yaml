# Watch on simulator: login → open Lala → type a message → see reply bubble
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml
- runFlow: ../subflows/tap-tenant-lala-ai.yaml
- assertVisible: "Lala Assistant"

- assertVisible:
    text: "Ask me anything about your property"
    optional: true

- tapOn:
    text: "Type your message..."
    optional: true

- extendedWaitUntil:
    visible: "Type your message..."
    timeout: 15000

- inputText: "What is my monthly rent?"
- pressKey: Enter

- extendedWaitUntil:
    visible: "Lala is typing..."
    timeout: 10000
    optional: true

- extendedWaitUntil:
    notVisible: "Network error"
    timeout: 45000
