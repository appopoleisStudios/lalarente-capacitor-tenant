# PR #6 — Owner Lala AI
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-owner.yaml

- openLink: lalarenteapp:///(owner)/ai-chat

- extendedWaitUntil:
    visible: "Lala Assistant"
    timeout: 20000

- tapOn:
    text: "Type your message..."
- inputText: "How many active leases do I have?"
- pressKey: Enter

- extendedWaitUntil:
    notVisible: "Network error"
    timeout: 45000
