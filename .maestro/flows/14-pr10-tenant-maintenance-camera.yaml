# PR #10 — Maintenance report shows Camera action (S2-36 upload path entry)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/maintenance/report

- extendedWaitUntil:
    notVisible: "Loading form..."
    timeout: 30000

- extendedWaitUntil:
    visible: "Submit Request"
    timeout: 30000

- scrollUntilVisible:
    element:
      id: "maintenance-add-camera"
    direction: DOWN
    timeout: 25000

- assertVisible:
    id: "maintenance-add-camera"
