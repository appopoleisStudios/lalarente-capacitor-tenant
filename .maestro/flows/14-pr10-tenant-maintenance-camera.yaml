# PR #10 — Maintenance report shows Camera action (S2-36 upload path entry)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/maintenance/report

- extendedWaitUntil:
    visible: "Report Issue"
    timeout: 20000

- scrollUntilVisible:
    element:
      text: "Camera"
    direction: DOWN
    timeout: 15000

- assertVisible: "Camera"
- assertVisible: "Photos & Videos"
