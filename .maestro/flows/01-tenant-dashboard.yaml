# Self-contained tenant dashboard E2E test
# Uses re-usable login-tenant subflow which handles both cached session and fresh login.
appId: com.lalarente.app
---
# === FRESH LAUNCH ===
- stopApp

# === LOGIN (handles cached session or fresh login) ===
- runFlow: ../subflows/login-tenant.yaml

# === NAVIGATE TO MAINTENANCE ===
- openLink: lalarenteapp:///(tenant)/maintenance
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000

# === NAVIGATE TO AI CHAT ===
- openLink: lalarenteapp:///(tenant)/ai-chat
- extendedWaitUntil:
    visible: "Lala Assistant"
    timeout: 20000
