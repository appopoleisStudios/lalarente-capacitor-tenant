# Self-contained tenant dashboard E2E test
# Uses ONLY text-based selectors for compatibility with stale builds.
# No subflow chaining, no testID selectors.
appId: com.lalarente.app
---
# === FRESH LAUNCH ===
- stopApp
- launchApp

# === WAIT FOR LOGIN SCREEN (text-based) ===
# The app auto-redirects to /auth/login when no session is active.
# Wait generously for JS bundle to load and login screen to render.
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000

- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 30000

# === FILL IN CREDENTIALS ===
# Clear and fill email input
- tapOn:
    id: "email-input"
- eraseText
- inputText: ${TENANT_EMAIL}

# Clear and fill password input
- tapOn:
    id: "password-input"
- eraseText
- inputText: ${TENANT_PASSWORD}

# === TAP SIGN IN ===
- tapOn:
    id: "sign-in-button"

# === VERIFY LOGIN SUCCEEDED ===
# Wait for login screen to disappear (proves navigation happened)
- extendedWaitUntil:
    notVisible: "Welcome back"
    timeout: 30000
    optional: true

- runFlow:
    when:
      visible: "Welcome back"
    commands:
      # Login still visible — tap Sign In again (button may have been disabled)
      - tapOn:
          id: "sign-in-button"
      - extendedWaitUntil:
          notVisible: "Welcome back"
          timeout: 30000

# === WAIT FOR DASHBOARD ===
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 60000
    optional: true

# === VERIFY DASHBOARD ===
- assertVisible:
    text: "Welcome back,"
    optional: true

# === NAVIGATE TO MAINTENANCE ===
- openLink: lalarenteapp:///(tenant)/maintenance
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000

# === NAVIGATE TO AI CHAT ===
- openLink: lalarenteapp:///(tenant)/ai-chat
- extendedWaitUntil:
    visible: "Lala Assistant"
    timeout: 20000
