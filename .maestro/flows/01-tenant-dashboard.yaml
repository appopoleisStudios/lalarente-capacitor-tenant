# Self-contained tenant dashboard E2E test
# Handles both fresh start (no session) and cached session from previous run.
# Uses ONLY text-based selectors for compatibility with stale builds.
appId: com.lalarente.app
---
# === FRESH LAUNCH ===
- stopApp
- launchApp

# === SESSION DETECTION ===
# Check if already logged in (cached session restored from SecureStore)
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 60000
    optional: true

# Already on dashboard — skip login
- runFlow:
    when:
      visible: "Welcome back,"
    commands:
      - assertVisible:
          text: "Welcome back,"
          optional: true

# Not logged in — go through login flow
- runFlow:
    when:
      notVisible: "Welcome back,"
    commands:
      # Wait for login screen
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 30000
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 30000

      # Fill credentials
      - tapOn:
          id: "email-input"
      - eraseText
      - inputText: ${TENANT_EMAIL}

      - tapOn:
          id: "password-input"
      - eraseText
      - inputText: ${TENANT_PASSWORD}

      # Tap Sign In
      - tapOn:
          id: "sign-in-button"

      # Wait for navigation to dashboard
      - extendedWaitUntil:
          notVisible: "Welcome back"
          timeout: 30000
          optional: true

      - runFlow:
          when:
            visible: "Welcome back"
          commands:
            - tapOn:
                id: "sign-in-button"
            - extendedWaitUntil:
                notVisible: "Welcome back"
                timeout: 30000

      # Verify dashboard
      - extendedWaitUntil:
          visible: "Welcome back,"
          timeout: 60000
          optional: true

# === NAVIGATE TO MAINTENANCE ===
- openLink: lalarenteapp:///(tenant)/maintenance
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000

# === NAVIGATE TO AI CHAT ===
- openLink: lalarenteapp:///(tenant)/ai-chat
- extendedWaitUntil:
    visible: "Lala Assistant"
    timeout: 20000
