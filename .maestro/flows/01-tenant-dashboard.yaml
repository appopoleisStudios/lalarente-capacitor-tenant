# Watch on simulator: login → tenant dashboard loads
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml

- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 15000

- assertVisible: "Viewings & applications"

- openLink: lalarenteapp:///(tenant)/maintenance
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000

- openLink: lalarenteapp:///(tenant)/ai-chat
- extendedWaitUntil:
    visible: "Lala Assistant"
    timeout: 20000
