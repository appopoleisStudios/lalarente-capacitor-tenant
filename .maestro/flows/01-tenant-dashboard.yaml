# Watch on simulator: login → tenant dashboard loads
appId: com.lalarente.app
---
- launchApp
- runFlow: ../subflows/login-tenant.yaml

# Quick Actions (Maintenance, Lala AI) sit below lease cards — scroll to them
- scrollUntilVisible:
    element: "Quick Actions"
    direction: DOWN
    timeout: 15000

- assertVisible: "Maintenance"
- assertVisible: "Lala AI"
