# Watch on simulator: login → tenant dashboard loads
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml

- extendedWaitUntil:
    visible:
        id: "tenant-dashboard-header"
    timeout: 15000

- scrollUntilVisible:
    element: "Maintenance"
    direction: DOWN
    timeout: 20000

- assertVisible: "Maintenance"

- extendedWaitUntil:
    visible: "Lala AI"
    timeout: 10000
