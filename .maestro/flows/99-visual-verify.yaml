# Visual verification: Bottom tab bar works on all tenant screens
appId: com.lalarente.app
---
# Open Profile screen
- openLink: lalarenteapp:///(tenant)/profile
- extendedWaitUntil:
    visible: "My Profile"
    timeout: 15000

# Tap Home tab - should navigate to dashboard
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "Search"
    timeout: 10000

# Tap Payments tab
- tapOn:
    id: "tab-payments"
- extendedWaitUntil:
    visible: "Payments"
    timeout: 10000

# Tap Lala AI tab
- tapOn:
    id: "tab-lala-ai"
- extendedWaitUntil:
    visible: "Lala Assistant"
    timeout: 10000

# Tap Profile tab - should navigate back to profile
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "My Profile"
    timeout: 10000

# Verify search tab
- tapOn:
    id: "tab-search"
- extendedWaitUntil:
    visible: "Search Properties"
    timeout: 10000
    optional: true

# Final screenshot
- takeScreenshot: "visual-verify-final"
