# Vendor dashboard — login → verify dashboard loads
# login-vendor clears session (clearKeychain + UI fallback) without clearState
# (clearState wipes Expo Metro URL). No deep links.
appId: com.lalarente.app
---
- runFlow: ../subflows/login-vendor.yaml

- extendedWaitUntil:
    visible: "Quotes"
    timeout: 15000

- assertVisible:
    text: "Available"
    optional: true
- assertVisible:
    text: "Quotes"
    optional: true
- assertVisible:
    text: "Active"
    optional: true
- assertVisible:
    text: "Completed"
    optional: true
