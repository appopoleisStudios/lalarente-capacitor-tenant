# Lifecycle stage 7d — Work, closure and tenant verification (runs right
# after 07c: the PO starts today)
# Vendor starts work, posts a progress update, requests closure; owner views
# progress, opens the closure review (Request Changes → Cancel), approves and
# forwards to the tenant; tenant opens it from Reports and from the request,
# exercises "Work Needs Fixes" validation, then approves the work.
# Photo picks use screen points (unverified on device, as in stage 6).
# Not on this path: tenant closure-confirm screen (tenant-dispatched jobs
# only), Reclaim (tenant_dispatching only), sending a closure rejection
# (needs a second closure cycle), mediation (3 rejections).
# Env: creds incl. VENDOR_*, LC_TOKEN
appId: com.lalarente.app
---
# ── PHASE 1 — vendor: start work ──────────────────────────────────────────
- runFlow: ../subflows/login-vendor.yaml
- tapOn:
    id: "tab-vendor-jobs"
- extendedWaitUntil:
    visible: "My Jobs"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: ".*inspection.*LC-${LC_TOKEN}.*"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    text: ".*inspection.*LC-${LC_TOKEN}.*"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "vendor-start-work"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "vendor-start-work"
- extendedWaitUntil:
    visible: ".*Start Work"
    timeout: 15000
- tapOn:
    text: ".*Not Yet.*"
- assertVisible:
    id: "vendor-start-work"
- tapOn:
    id: "vendor-start-work"
- extendedWaitUntil:
    visible: ".*Start Work"
    timeout: 15000
- tapOn:
    text: ".*Start Now.*"
- extendedWaitUntil:
    visible: ".*Work started.*"
    timeout: 30000
- tapOn:
    text: "(OK|Got it!?)"

# ── daily progress update: notes + 1 photo ────────────────────────────────
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "vendor-daily-update"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "vendor-daily-update"
- extendedWaitUntil:
    visible: "Daily Progress Update"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: ".*Submit Progress Update.*"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
# Submit stays disabled until notes and a photo are added (no alert)
- assertVisible:
    text: ".*Submit Progress Update.*"
    enabled: false
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: ".*Completed tiling.*"
    direction: UP
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    text: ".*Completed tiling.*"
- inputText: "LC-progress ${LC_TOKEN}"
- tapOn:
    text: ".*Daily Progress Update.*"
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "(media-add-gallery|closure-confirm-gallery)"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "(media-add-gallery|closure-confirm-gallery)"
- waitForAnimationToEnd:
    timeout: 2500
# multi-select picker (out-of-process — Maestro cannot see inside it):
# wait for it, tap the first tile, confirm with ✓
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    point: "50%,28%"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: "90%,15%"
- waitForAnimationToEnd:
    timeout: 3000
# single-select pickers with editing show a crop screen instead
- tapOn:
    text: "Choose"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
# single-select picker still open (it can ignore the first tap): retry
- repeat:
    times: 3
    while:
      visible: "Collections"
    commands:
      - tapOn:
          point: "50%,28%"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Choose"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- waitForAnimationToEnd:
    timeout: 2500
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: ".*Submit Progress Update.*"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    text: ".*Submit Progress Update.*"
- extendedWaitUntil:
    visible: ".*Update Submitted"
    timeout: 60000
- tapOn:
    text: "OK"

# ── request closure: notes + 2 photos ─────────────────────────────────────
