# ── PHASE 4 — owner sees the verified job; work order report when generated ───
- runFlow: ../subflows/login-owner.yaml
- openLink: lalarenteapp://(owner)/maintenance
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: ".*inspection.*LC-${LC_TOKEN}.*"
    direction: DOWN
