    centerElement: true

# ── Request Changes modal: send disabled while empty, type reason, Cancel ───
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "closure-reject-button"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "closure-reject-button"
- extendedWaitUntil:
    visible:
      id: "closure-reject-reason"
    timeout: 20000
- tapOn:
    id: "closure-reject-send"
- assertVisible:
    id: "closure-reject-reason"
- tapOn:
    id: "closure-reject-reason"
- inputText: "LC-reject-draft ${LC_TOKEN}"
- tapOn:
    id: "closure-reject-cancel"
- extendedWaitUntil:
    notVisible:
      id: "closure-reject-reason"
    timeout: 15000

# ── Approve → Cancel, then Approve ────────────────────────────────────────
- tapOn:
    id: "closure-approve-button"
- extendedWaitUntil:
    visible: "Approve Job Completion"
    timeout: 15000
- tapOn:
    text: "Cancel"
- assertVisible:
    id: "closure-approve-button"
- tapOn:
    id: "closure-approve-button"
- extendedWaitUntil:
    visible: "Approve Job Completion"
    timeout: 15000
- tapOn:
    text: "Approve"
- extendedWaitUntil:
    visible: "Closure approved successfully."
    timeout: 30000
- tapOn:
    text: "OK"

# ── Forward to Tenant → Cancel, then forward ──────────────────────────────
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "closure-forward-button"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "closure-forward-button"
- extendedWaitUntil:
    visible: "Forward to Tenant"
    timeout: 15000
- tapOn:
    text: "Cancel"
- assertVisible:
    id: "closure-forward-button"
- tapOn:
    id: "closure-forward-button"
- extendedWaitUntil:
    visible: "Forward to Tenant"
    timeout: 15000
- tapOn:
    text: ".*Forward for Verification.*"
- extendedWaitUntil:
    visible: "Forwarded"
    timeout: 30000
- tapOn:
    text: "OK"
- takeScreenshot: lc07d-owner-forwarded
- waitForAnimationToEnd:
    timeout: 1500
- openLink: lalarenteapp://(owner)/
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/sign-out-owner.yaml

# ── PHASE 3 — tenant: Reports row opens verification ──────────────────────
- runFlow: ../subflows/login-tenant.yaml
- openLink: lalarenteapp://(tenant)/reports
- extendedWaitUntil:
    visible: "Reports"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "tenant-report-closure-row"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "tenant-report-closure-row"
    index: 0
- extendedWaitUntil:
