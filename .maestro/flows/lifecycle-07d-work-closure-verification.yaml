    timeout: 20000

# ── Work is Satisfactory: back, feedback, photo add/remove/add, confirm ───
- tapOn:
    id: "tenant-verify-satisfactory"
- extendedWaitUntil:
    visible:
      id: "tenant-verify-approve-notes"
    timeout: 20000
- tapOn:
    id: "tenant-verify-approve-back"
- extendedWaitUntil:
    visible:
      id: "tenant-verify-satisfactory"
    timeout: 20000
- tapOn:
    id: "tenant-verify-satisfactory"
- tapOn:
    id: "tenant-verify-approve-notes"
- inputText: "LC-verified ${LC_TOKEN}"
- tapOn:
    text: "Feedback \\(Optional\\)"
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "tenant-verify-approve-add-photo"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "tenant-verify-approve-add-photo"
