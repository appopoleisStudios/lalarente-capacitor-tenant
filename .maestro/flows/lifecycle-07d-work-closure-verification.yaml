      id: "tenant-verify-title"
    timeout: 25000
- assertVisible: ".*LC-closure ${LC_TOKEN}.*"
- assertVisible:
    id: "tenant-verify-satisfactory"
- assertVisible:
    id: "tenant-verify-needs-fixes"
- takeScreenshot: lc07d-tenant-verify-from-reports
- waitForAnimationToEnd:
    timeout: 1500

# ── request detail: Verify Completed Work opens the same screen ───────────
- openLink: lalarenteapp://(tenant)/maintenance
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: ".*inspection.*LC-${LC_TOKEN}.*"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
