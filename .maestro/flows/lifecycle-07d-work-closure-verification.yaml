- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "(media-add-gallery|closure-confirm-gallery)"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "(media-add-gallery|closure-confirm-gallery)"
- waitForAnimationToEnd:
    timeout: 2500
# multi-select picker (out-of-process — Maestro cannot see inside it):
# wait for it, tap the first tile, confirm with ✓
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    point: "50%,28%"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: "90%,15%"
- waitForAnimationToEnd:
    timeout: 3000
# single-select pickers with editing show a crop screen instead
- tapOn:
    text: "Choose"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
# single-select picker still open (it can ignore the first tap): retry
- repeat:
    times: 3
    while:
      visible: "Collections"
    commands:
      - tapOn:
          point: "50%,28%"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Choose"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- waitForAnimationToEnd:
    timeout: 2500
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "(media-add-gallery|closure-confirm-gallery)"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "(media-add-gallery|closure-confirm-gallery)"
- waitForAnimationToEnd:
    timeout: 2500
# multi-select picker (out-of-process — Maestro cannot see inside it):
# wait for it, tap the first tile, confirm with ✓
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    point: "50%,28%"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: "90%,15%"
- waitForAnimationToEnd:
    timeout: 3000
# single-select pickers with editing show a crop screen instead
- tapOn:
    text: "Choose"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
# single-select picker still open (it can ignore the first tap): retry
- repeat:
    times: 3
    while:
      visible: "Collections"
    commands:
      - tapOn:
          point: "50%,28%"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Choose"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- waitForAnimationToEnd:
    timeout: 2500
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "closure-submit"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
