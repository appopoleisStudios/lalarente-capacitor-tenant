    text: ".*inspection.*LC-${LC_TOKEN}.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "tenant-maintenance-detail-back"
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
