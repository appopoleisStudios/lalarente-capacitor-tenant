- assertVisible: ".*LC-progress ${LC_TOKEN}.*"
- takeScreenshot: lc07d-owner-progress
- waitForAnimationToEnd:
    timeout: 1500
- openLink: lalarenteapp://(owner)/maintenance
- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: ".*inspection.*LC-${LC_TOKEN}.*"
    direction: DOWN
    timeout: 20000
