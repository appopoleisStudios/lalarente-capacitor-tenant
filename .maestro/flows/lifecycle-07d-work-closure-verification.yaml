- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "tenant-verify-reject-submit"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "tenant-verify-reject-submit"
- extendedWaitUntil:
