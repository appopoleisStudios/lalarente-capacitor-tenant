# single-select pickers with editing show a crop screen instead
- tapOn:
    text: "Choose"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
# single-select picker still open (it can ignore the first tap): retry
- repeat:
    times: 3
    while:
      visible: "Collections"
    commands:
      - tapOn:
          point: "50%,28%"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Choose"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- waitForAnimationToEnd:
    timeout: 2500
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "tenant-verify-approve-remove-photo"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "tenant-verify-approve-remove-photo"
    index: 0
- extendedWaitUntil:
    notVisible:
      id: "tenant-verify-approve-remove-photo"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "tenant-verify-approve-add-photo"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "tenant-verify-approve-add-photo"
- waitForAnimationToEnd:
