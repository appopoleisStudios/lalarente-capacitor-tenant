# S2-32 / S2-33 — Tenant payments history + make payment affordance
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app.yaml
- runFlow: ../../subflows/login-tenant.yaml

- extendedWaitUntil:
    visible:
        id: "tenant-dashboard-header"
    timeout: 15000

- openLink: lalarenteapp:///(tenant)/payments

- extendedWaitUntil:
    visible: "Payments"
    timeout: 20000

- scrollUntilVisible:
    element:
      text: "Payment History"
    direction: DOWN
    timeout: 25000

- assertVisible: "Payment History"
- assertVisible:
    text: "Pay Now"
    optional: true
- assertVisible:
    text: "Make Payment"
    optional: true
