# S2-32 / S2-33 — Tenant payments history + make payment affordance
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app-warm.yaml
- runFlow: ../../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/payments

- extendedWaitUntil:
    visible:
      id: "tab-payments"
    timeout: 30000

- assertVisible:
    text: "Payments"
    optional: true
- assertVisible:
    text: "No Active Lease"
    optional: true

- scrollUntilVisible:
    element:
      text: "Payment History"
    direction: DOWN
    timeout: 25000
    optional: true

- assertVisible:
    text: "Payment History"
    optional: true
- assertVisible:
    text: "Pay Now"
    optional: true
- assertVisible:
    text: "Make Payment"
    optional: true
