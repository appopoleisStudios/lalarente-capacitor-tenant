# S2-32 / S2-33 — Tenant payments history + make payment affordance
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app.yaml
- runFlow: ../../subflows/login-tenant.yaml

- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 15000

- tapOn:
    point: "50%,96%"

- extendedWaitUntil:
    visible: "Payment History"
    timeout: 20000

- assertVisible:
    text: "Make Payment"
    optional: true
- assertVisible:
    text: "Pay Now"
    optional: true
