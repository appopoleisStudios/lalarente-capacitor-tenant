# S2-31 — Tenant contact owner → message
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app-warm.yaml
- runFlow: ../../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/lease

- extendedWaitUntil:
    visible: "My Lease"
    timeout: 30000
    optional: true

- assertVisible:
    text: "No Active Lease"
    optional: true

- tapOn:
    text: "Contact Owner"
    optional: true

- tapOn:
    text: "Message"
    optional: true

- extendedWaitUntil:
    visible: "Type a message"
    timeout: 20000
    optional: true
