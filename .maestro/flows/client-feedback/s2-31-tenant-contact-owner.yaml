# S2-31 — Tenant contact owner → message
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app-warm.yaml
- runFlow: ../../subflows/login-tenant.yaml

- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "view-lease-details"
    direction: DOWN
    timeout: 25000

- tapOn:
    id: "view-lease-details"
- extendedWaitUntil:
    visible: "Contact Owner"
    timeout: 15000
    optional: true

- tapOn:
    text: "Contact Owner"
    optional: true

- tapOn:
    text: "Message"
    optional: true

- extendedWaitUntil:
    visible: "Type a message"
    timeout: 20000
    optional: true
