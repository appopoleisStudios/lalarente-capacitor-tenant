# S2-11 / S2-12 — Rent roll + payment reminder affordance
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app-warm.yaml
- runFlow: ../../subflows/login-owner.yaml

- openLink: lalarenteapp:///(owner)/rent-roll

- extendedWaitUntil:
    visible: "Rent Roll"
    timeout: 20000

- assertVisible:
    text: "Reminder"
    optional: true
- assertVisible:
    text: "Send Reminder"
    optional: true
