# S2-11 / S2-12 — Rent roll + payment reminder affordance
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app.yaml
- runFlow: ../../subflows/login-owner.yaml

- scrollUntilVisible:
    element: "Rent Roll"
    direction: DOWN
    timeout: 20000

- tapOn: "Rent Roll"
- extendedWaitUntil:
    visible: "Rent Roll"
    timeout: 15000

- assertVisible:
    text: "Reminder"
    optional: true

- assertVisible:
    text: "Send Reminder"
    optional: true
