# S2-01 — Owner dashboard stats (properties, leases, rent roll)
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app.yaml
- runFlow: ../../subflows/login-owner.yaml

- assertVisible:
    text: "Portfolio Dashboard"
    optional: true
- assertVisible:
    text: "Welcome to LaLarente"
    optional: true

- openLink: lalarenteapp:///(owner)/documents
- extendedWaitUntil:
    visible: "All Documents"
    timeout: 20000

- assertVisible: "Recent Documents"
