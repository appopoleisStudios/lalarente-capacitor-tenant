# S2-40 — Tenant send message in thread
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app-warm.yaml
- runFlow: ../../subflows/open-tenant-messages.yaml

- assertVisible:
    text: "No Messages"
    optional: true

- runFlow:
    file: ../../subflows/tenant-send-message.yaml
    env:
      MESSAGE_TEXT: "Tenant QA reply for client sign-off"
