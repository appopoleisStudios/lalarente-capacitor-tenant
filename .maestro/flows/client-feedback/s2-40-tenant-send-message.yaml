# S2-40 — Tenant send message in thread
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app-warm.yaml
# REQUIRED: ensure the tenant session (self-healing sign-in). Flows that skip
# this and blindly tap tab-home fail when the app resumes on a pushed screen
# (no tab bar) or a different role's dashboard. Mirrors flows 11/13.
- runFlow: ../../subflows/login-tenant.yaml
- runFlow: ../../subflows/open-tenant-messages.yaml

- assertVisible:
    text: "No Messages"
    optional: true

- runFlow:
    file: ../../subflows/tenant-send-message.yaml
    env:
      MESSAGE_TEXT: "Tenant QA reply for client sign-off"
