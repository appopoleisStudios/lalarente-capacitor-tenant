# S2-40 — Tenant send message in thread
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml

- tapOn: "Messages"
- extendedWaitUntil:
    visible: "Messages"
    timeout: 15000
    optional: true

- tapOn:
    point: "50%,40%"
    optional: true

- extendedWaitUntil:
    visible: "Type a message"
    timeout: 20000
    optional: true

- tapOn:
    text: "Type a message..."
    optional: true

- inputText: "Tenant QA reply for client sign-off"
- pressKey: Enter

- assertVisible:
    text: "Tenant QA reply"
    optional: true
