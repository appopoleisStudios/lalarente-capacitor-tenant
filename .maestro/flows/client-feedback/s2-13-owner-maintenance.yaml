# S2-13 / S2-14 — Maintenance list + vendor routing UI (needs seeded vendors for full path)
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app-warm.yaml
- runFlow: ../../subflows/login-owner.yaml

- openLink: lalarenteapp:///(owner)/maintenance

- extendedWaitUntil:
    visible: "Maintenance"
    timeout: 20000

- tapOn:
    point: "50%,40%"
    optional: true

- extendedWaitUntil:
    visible: "Assign"
    timeout: 15000
    optional: true

- assertVisible:
    text: "Vendor"
    optional: true
- assertVisible:
    text: "Dedicated"
    optional: true
