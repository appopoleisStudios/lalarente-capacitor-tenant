# S2-21 — Property detail photos visible (refresh after edit is manual compare)
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app-warm.yaml
- runFlow: ../../subflows/login-owner.yaml

- openLink: lalarenteapp:///(owner)/properties

- extendedWaitUntil:
    visible: "My Properties"
    timeout: 20000

- tapOn:
    point: "50%,35%"
    optional: true

- extendedWaitUntil:
    visible: "Property Details"
    timeout: 15000
    optional: true

- assertVisible:
    text: "Photo"
    optional: true
- assertVisible:
    text: "Edit"
    optional: true
