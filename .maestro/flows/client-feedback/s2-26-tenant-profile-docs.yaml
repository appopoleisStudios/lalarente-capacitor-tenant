# S2-26 / S2-28 / S2-29 — Profile + proof of address upload affordance (PDF picker)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml

- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 15000

- scrollUntilVisible:
    element: "Proof of Address"
    direction: DOWN
    timeout: 15000

- assertVisible: "Proof of Address"
- assertVisible:
    text: "Upload"
    optional: true
- assertVisible:
    text: "Document"
    optional: true
- assertVisible:
    text: "PDF"
    optional: true
