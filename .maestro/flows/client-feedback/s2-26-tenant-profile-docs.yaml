# S2-26 / S2-28 / S2-29 — Profile + proof of address upload affordance (PDF picker)
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app-warm.yaml
- runFlow: ../../subflows/login-tenant.yaml
- runFlow: ../../subflows/tap-tenant-profile.yaml

- extendedWaitUntil:
    visible:
      id: "tenant-profile-title"
    timeout: 15000

- scrollUntilVisible:
    element: "Proof of Address"
    direction: DOWN
    timeout: 15000
    optional: true

- extendedWaitUntil:
    visible: "Proof of Address"
    timeout: 10000

- assertVisible: "Proof of Address"
- assertVisible:
    text: "Upload"
    optional: true
- assertVisible:
    text: "Document"
    optional: true
- assertVisible:
    text: "PDF"
    optional: true
