# S2-03 / S2-04 — Owner viewings list (expired viewing behaviour is data-dependent)
appId: com.lalarente.app
---
- runFlow: ../../subflows/launch-app.yaml
- runFlow: ../../subflows/login-owner.yaml

- openLink: lalarenteapp:///(owner)/viewings

- extendedWaitUntil:
    visible: "Viewings"
    timeout: 20000

- assertVisible:
    text: "Viewing"
    optional: true
- assertVisible:
    text: "viewing"
    optional: true
