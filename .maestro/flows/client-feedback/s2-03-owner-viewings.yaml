# S2-03 / S2-04 — Owner viewings list (expired viewing behaviour is data-dependent)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-owner.yaml

- scrollUntilVisible:
    element: "Viewing"
    direction: DOWN
    timeout: 15000
    optional: true

- tapOn:
    text: "Viewing"
    optional: true

- runFlow:
    when:
      notVisible: "Viewings"
    commands:
      - tapOn: "Properties"
      - tapOn:
          point: "50%,30%"
          optional: true

- extendedWaitUntil:
    visible: "Viewings"
    timeout: 15000
    optional: true

- tapOn:
    text: "Viewings"
    optional: true

- assertVisible:
    text: "Viewing"
    optional: true
