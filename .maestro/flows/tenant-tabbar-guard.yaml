# Tenant tab bar regression guard (Plane #82 follow-up)
# PREVENTS: a "Vendor Payments" tab silently reappearing on the tenant bottom
# navbar. This has regressed multiple times (commits ad7dfe3 / eb19049 both
# re-hid it). Any future PR that re-registers vendor-payments as a visible tab
# FAILS this flow, so the suite can never ship the regression again.
#
# The guard asserts:
#   1. The 5 canonical tabs exist (Home, Search, Payments, Profile, Lala AI)
#   2. NO "Vendor Payments" text is visible on the dashboard — a re-added tab
#      would render its label in the tab bar and trip assertNotVisible.
#      (After Plane #82 the dashboard has no other "Vendor Payments" text.)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

# Land on the tenant dashboard deterministically — the app may resume on a
# pushed screen (no tab bar) after login, so tap the Home tab explicitly.
- tapOn:
    id: 'tab-home'
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: 'tenant-dashboard-header'
    timeout: 30000

# The 5 canonical tab bar entries must all be present.
- assertVisible:
    id: 'tab-home'
- assertVisible:
    id: 'tab-search'
- assertVisible:
    id: 'tab-payments'
- assertVisible:
    id: 'tab-profile'
- assertVisible:
    id: 'tab-lala-ai'

# THE guard: a Vendor Payments tab must NOT be in the bottom navbar.
#
# ⚠️ REGRESSION (Aug 12): a re-registered tab can render with the RAW ROUTE
# NAME as its label (e.g. "vendor-payments/index") and NO testID — that is
# exactly how the bug survived four previous "re-hide" PRs (name mismatch in
# _layout.tsx auto-registered the route as a visible tab). The old guard
# (text "Vendor Payments" + id "tab-vendor-payments") passed VACUOUSLY while
# the tab was on screen. Maestro text matchers are regex, so this single
# catch-all covers EVERY label form (title, raw route name, a11y label
# "vendor-payments/index, tab, N of N").
- assertNotVisible:
    text: '.*vendor-payments.*'

# Belt-and-braces: a visible "Vendor Payments"/"Pay Vendor" title or testID
# is caught by the catch-all above; these also guard future renames.
- assertNotVisible:
    text: '.*Vendor Payments.*'
- assertNotVisible:
    id: 'tab-vendor-payments'
- assertNotVisible:
    id: 'tab-pay-vendor'
