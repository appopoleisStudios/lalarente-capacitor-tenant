# PR #9 — Owner conduct inspection, rooms render (S2-17, S2-18)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-owner.yaml

- openLink: lalarenteapp:///(owner)/inspections

- extendedWaitUntil:
    visible: "Inspections"
    timeout: 20000

- tapOn:
    text: "In Progress"
    optional: true

- tapOn:
    text: "Move-In"
    optional: true

- tapOn:
    text: "in progress"
    optional: true

- extendedWaitUntil:
    visible: "Room 1 of"
    timeout: 20000
    optional: true

- assertVisible:
    text: "Excellent"
    optional: true

- assertVisible: "Inspections"
