# Setup for android-keyboard-forms-guard (run by scripts/run-android-guards.sh
# after lifecycle 01 → 02d): the tenant submits an application and nothing
# else, so the owner can still open its Reject prompt AND its holding-deposit
# dialog. (lifecycle-03a also requests the deposit, which hides that dialog.)
# Env: creds, LC_PROPERTY_ID, LC_PROPERTY_TITLE
appId: com.lalarente.app
---
- runFlow: ../subflows/login-tenant.yaml
- runFlow:
    file: ../subflows/lc-tenant-apply.yaml
    env:
      PROP_ID: "${LC_PROPERTY_ID}"
      PROP_TITLE: "${LC_PROPERTY_TITLE}"
- scrollUntilVisible:
    element: "(?i).*submitted.*"
    direction: UP
    timeout: 20000
- openLink: lalarenteapp://(tenant)/
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/sign-out-tenant.yaml
