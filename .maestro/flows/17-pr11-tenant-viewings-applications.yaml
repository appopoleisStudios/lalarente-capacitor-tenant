# S2-43 / S2-44 — tenant viewing history + application status nav
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/login-tenant.yaml

- assertVisible: "Viewings & applications"

- scrollUntilVisible:
    element:
      id: "viewings-viewing-history"
    direction: DOWN
    timeout: 15000

- tapOn:
    id: "viewings-viewing-history"
- extendedWaitUntil:
    visible: "My Viewings"
    timeout: 15000
- back

- scrollUntilVisible:
    element:
      id: "viewings-application-status"
    direction: DOWN
    timeout: 15000

- tapOn:
    id: "viewings-application-status"
- extendedWaitUntil:
    visible: "My Applications"
    timeout: 15000
