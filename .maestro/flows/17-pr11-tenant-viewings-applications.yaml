# S2-43 / S2-44 — tenant viewing history + application status nav
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/viewings
- extendedWaitUntil:
    visible: "My Viewings"
    timeout: 20000

- openLink: lalarenteapp:///(tenant)/application-status
- extendedWaitUntil:
    visible: "My Applications"
    timeout: 20000
