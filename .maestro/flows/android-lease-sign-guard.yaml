# Android regression guard — client test of build 11 (Navin, 96 De Waal):
# neither tenant nor owner could sign a lease on Android because the signature
# modal's Clear / Confirm buttons sat under the system navigation bar.
# Run on the Android emulator with the release APK:
#   LEASE_ID=$(node scripts/seed-sign-guard-lease.mjs)
#   maestro --device emulator-5554 test -e LEASE_ID=$LEASE_ID ... this file
#   node scripts/reset-lifecycle-fixture.mjs --apply
# Starts signed out, or signed in as the owner or the tenant.
# Needs 3-button navigation (the tallest nav bar) to catch the bug —
# scripts/run-android-guards.sh switches the emulator to it. The proof that a
# tap reached the app is the in-app success alert, not assertVisible.
appId: com.lalarente.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "(email-input|tab-owner-profile|tab-profile)"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "tab-owner-profile"
    file: ../subflows/sign-out-owner.yaml
- runFlow:
    when:
      visible:
        id: "tab-profile"
    file: ../subflows/sign-out-tenant.yaml

# ── Tenant signs ─────────────────────────────────────────────────────────────
- runFlow: ../subflows/login-tenant.yaml
- openLink: lalarenteapp://(tenant)/lease
- extendedWaitUntil:
    visible: "My Lease"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "tenant-lease-sign"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "tenant-lease-sign"
- extendedWaitUntil:
    visible:
      id: "signature-modal-confirm"
    timeout: 20000
- swipe:
    start: "30%,45%"
    end: "70%,55%"
    duration: 600
- swipe:
    start: "70%,45%"
    end: "30%,55%"
    duration: 600
- assertVisible:
    id: "signature-modal-confirm"
- takeScreenshot: android-sign-guard-tenant-modal
- tapOn:
    id: "signature-modal-confirm"
# the save really happened in the app (a tap under the nav bar lands in the OS)
- extendedWaitUntil:
    visible: ".*Lease agreement signed.*"
    timeout: 30000
- takeScreenshot: android-sign-guard-tenant-signed
- tapOn: "OK"
- runFlow: ../subflows/sign-out-tenant.yaml

# ── Owner signs ──────────────────────────────────────────────────────────────
- runFlow: ../subflows/login-owner.yaml
- openLink: lalarenteapp://(owner)/leases/${LEASE_ID}
- scrollUntilVisible:
    element:
      id: "owner-lease-sign"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "owner-lease-sign"
- extendedWaitUntil:
    visible:
      id: "signature-modal-confirm"
    timeout: 20000
- swipe:
    start: "30%,45%"
    end: "70%,55%"
    duration: 600
- swipe:
    start: "70%,45%"
    end: "30%,55%"
    duration: 600
- assertVisible:
    id: "signature-modal-confirm"
- takeScreenshot: android-sign-guard-owner-modal
- tapOn:
    id: "signature-modal-confirm"
- extendedWaitUntil:
    visible: ".*signed and activated.*"
    timeout: 30000
- takeScreenshot: android-sign-guard-owner-signed
- tapOn: "OK"
- assertNotVisible:
    id: "owner-lease-sign"
