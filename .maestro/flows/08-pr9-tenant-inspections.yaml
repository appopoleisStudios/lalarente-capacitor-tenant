# PR #9 — Tenant inspection reports / alert (S2-41, S2-42)
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-tenant.yaml

- openLink: lalarenteapp:///(tenant)/reports

- extendedWaitUntil:
    visible: "Reports"
    timeout: 20000

- assertVisible:
    text: "Inspection Reports"
    optional: true

- assertVisible:
    text: "Inspection Awaiting Your Signature"
    optional: true

- tapOn:
    text: "Inspection Awaiting Your Signature"
    optional: true

- extendedWaitUntil:
    visible: "Inspection"
    timeout: 15000
    optional: true

- assertNotVisible:
    text: "Preparing inspection checklist"
    optional: true
