# Self-contained owner dashboard E2E test
# Handles both logged-in and logged-out states (iOS keychain persists sessions)
appId: com.lalarente.app
---
# === FRESH LAUNCH ===
- stopApp
- launchApp

# === CHECK IF ALREADY LOGGED IN (keychain restored session) ===
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 30000
    optional: true

# Already logged in — skip to profile verification
- runFlow:
    when:
      visible: "Portfolio Dashboard"
    commands:
      - assertVisible: "Portfolio Dashboard"

# Not logged in — go through login flow
- runFlow:
    when:
      notVisible: "Portfolio Dashboard"
    commands:
      # Wait for login screen
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 30000
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 15000

      # Enter email
      - tapOn:
          id: "email-input"
      - eraseText
      - inputText: ${OWNER_EMAIL}

      # Enter password
      - tapOn:
          id: "password-input"
      - eraseText
      - inputText: ${OWNER_PASSWORD}

      # Tap Sign In
      - tapOn:
          id: "sign-in-button"

      # Wait for navigation to owner dashboard
      - extendedWaitUntil:
          notVisible: "Welcome back"
          timeout: 30000
          optional: true

      - runFlow:
          when:
            visible: "Welcome back"
          commands:
            - tapOn:
                id: "sign-in-button"
            - extendedWaitUntil:
                notVisible: "Welcome back"
                timeout: 30000

      # Verify owner dashboard
      - extendedWaitUntil:
          visible: "Portfolio Dashboard"
          timeout: 60000

# === VERIFY OWNER PROFILE ===
- openLink: lalarenteapp:///(owner)/profile
- extendedWaitUntil:
    visible: "Owner Account"
    timeout: 20000
