# Self-contained owner dashboard E2E test
# Run on fresh app install (no cached session)
appId: com.lalarente.app
---
# === FRESH LAUNCH ===
- stopApp
- launchApp

# === FAST-FAIL: Check for cached session ===
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
    optional: true

- runFlow:
    when:
      visible: "Welcome back"
    commands:
      # Already on login screen — continue

- runFlow:
    when:
      notVisible: "Welcome back"
    commands:
      # App restored a cached session — alert and fail fast
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 15000
          optional: true
      - runFlow:
          when:
            notVisible: "Welcome back"
          commands:
            - fail: "Cached session persisted — app did not start on login screen even after relaunch"

- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 30000

# === FILL CREDENTIALS ===
- tapOn:
    id: "email-input"
- eraseText
- inputText: ${OWNER_EMAIL}

- tapOn:
    id: "password-input"
- eraseText
- inputText: ${OWNER_PASSWORD}

# === TAP SIGN IN ===
- tapOn:
    id: "sign-in-button"

# === WAIT FOR NAVIGATION ===
- extendedWaitUntil:
    notVisible: "Welcome back"
    timeout: 30000
    optional: true

- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          id: "sign-in-button"
      - extendedWaitUntil:
          notVisible: "Welcome back"
          timeout: 30000

# === VERIFY OWNER DASHBOARD ===
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 60000

# === VERIFY OWNER PROFILE ===
- openLink: lalarenteapp:///(owner)/profile
- extendedWaitUntil:
    visible: "Owner Account"
    timeout: 20000
