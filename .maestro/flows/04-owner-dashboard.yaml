# Self-contained owner dashboard E2E test
# Handles all states: owner logged in, tenant logged in (keychain), or login screen
appId: com.lalarente.app
---
# === FRESH LAUNCH ===
- stopApp
- launchApp

# Check 1: Already logged in as owner — done
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 45000
    optional: true

- runFlow:
    when:
      visible: "Portfolio Dashboard"
    commands:
      - assertVisible: "Portfolio Dashboard"

# Check 2: On login screen — fill credentials
- runFlow:
    when:
      notVisible: "Portfolio Dashboard"
    commands:
      # Check if already on login screen
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 30000
          optional: true

      # Not on login screen — logged in as tenant, sign out first
      - runFlow:
          when:
            notVisible: "Welcome back"
          commands:
            # Tap the Profile tab to navigate to tenant profile
            - extendedWaitUntil:
                visible: "Welcome back,"
                timeout: 30000
            - tapOn:
                id: "tab-profile"
            # Wait for profile screen
            - extendedWaitUntil:
                visible:
                  id: "tenant-profile-title"
                timeout: 20000
            # Scroll down to find Sign Out button
            - swipe:
                direction: UP
                duration: 2000
            - extendedWaitUntil:
                text: "Sign Out"
                timeout: 10000
            # Tap Sign Out button
            - tapOn:
                text: "Sign Out"
            # Wait for confirmation dialog
            - extendedWaitUntil:
                text: "Are you sure"
                timeout: 10000
            # Confirm sign out
            - tapOn:
                text: "Sign Out"
            # Wait for login screen
            - extendedWaitUntil:
                visible: "Welcome back"
                timeout: 30000

      # === Login as owner ===
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 15000

      - tapOn:
          id: "email-input"
      - eraseText
      - inputText: ${OWNER_EMAIL}

      - tapOn:
          id: "password-input"
      - eraseText
      - inputText: ${OWNER_PASSWORD}

      - tapOn:
          id: "sign-in-button"

      - extendedWaitUntil:
          notVisible: "Welcome back"
          timeout: 30000
          optional: true

      - runFlow:
          when:
            visible: "Welcome back"
          commands:
            - tapOn:
                id: "sign-in-button"
            - extendedWaitUntil:
                notVisible: "Welcome back"
                timeout: 30000

      - extendedWaitUntil:
          visible: "Portfolio Dashboard"
          timeout: 60000

# === VERIFY OWNER PROFILE ===
- openLink: lalarenteapp:///(owner)/profile
- extendedWaitUntil:
    visible: "Owner Account"
    timeout: 20000
