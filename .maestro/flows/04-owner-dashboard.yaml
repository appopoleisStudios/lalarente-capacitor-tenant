# Self-contained owner dashboard E2E test
# Handles all states: logged in as owner, logged in as tenant (keychain), or login screen
appId: com.lalarente.app
---
# === FRESH LAUNCH ===
- stopApp
- launchApp

# Check 1: Already logged in as owner — done
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 60000
    optional: true

- runFlow:
    when:
      visible: "Portfolio Dashboard"
    commands:
      - assertVisible: "Portfolio Dashboard"

# Check 2: On login screen — fill credentials
- runFlow:
    when:
      notVisible: "Portfolio Dashboard"
    commands:
      # Check if we're on the login screen
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 15000
          optional: true

      # Not on login screen (logged in as tenant) — sign out first
      - runFlow:
          when:
            notVisible: "Welcome back"
          commands:
            # Navigate to tenant profile to sign out
            - openLink: lalarenteapp:///(tenant)/profile
            - extendedWaitUntil:
                visible: "My Profile"
                timeout: 15000
            # Scroll down to Sign Out button
            - swipe:
                direction: UP
                duration: 1500
            - extendedWaitUntil:
                visible: "Sign Out"
                timeout: 10000
            # Tap Sign Out
            - tapOn:
                text: "Sign Out"
            # Wait for confirmation dialog
            - extendedWaitUntil:
                visible: "Are you sure"
                timeout: 10000
            # Confirm sign out
            - tapOn:
                text: "Sign Out"
            # Wait for login screen
            - extendedWaitUntil:
                visible: "Welcome back"
                timeout: 30000

      # === Now on login screen — fill credentials ===
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 15000
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 15000

      # Enter email
      - tapOn:
          id: "email-input"
      - eraseText
      - inputText: ${OWNER_EMAIL}

      # Enter password
      - tapOn:
          id: "password-input"
      - eraseText
      - inputText: ${OWNER_PASSWORD}

      # Tap Sign In
      - tapOn:
          id: "sign-in-button"

      # Wait for navigation to owner dashboard
      - extendedWaitUntil:
          notVisible: "Welcome back"
          timeout: 30000
          optional: true

      - runFlow:
          when:
            visible: "Welcome back"
          commands:
            - tapOn:
                id: "sign-in-button"
            - extendedWaitUntil:
                notVisible: "Welcome back"
                timeout: 30000

      # Verify owner dashboard
      - extendedWaitUntil:
          visible: "Portfolio Dashboard"
          timeout: 60000

# === VERIFY OWNER PROFILE ===
- openLink: lalarenteapp:///(owner)/profile
- extendedWaitUntil:
    visible: "Owner Account"
    timeout: 20000
