# Self-contained owner dashboard E2E test
# Handles both logged-in and logged-out states
appId: com.lalarente.app
---
# === FRESH LAUNCH ===
- stopApp
- launchApp

# === WAIT FOR LOGIN SCREEN (text-based) ===
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000

- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 30000

# === FILL IN CREDENTIALS ===
- tapOn:
    id: "email-input"
- eraseText
- inputText: ${OWNER_EMAIL}

- tapOn:
    id: "password-input"
- eraseText
- inputText: ${OWNER_PASSWORD}

# === TAP SIGN IN ===
- tapOn:
    id: "sign-in-button"

# === WAIT FOR NAVIGATION TO OWNER DASHBOARD ===
- extendedWaitUntil:
    notVisible: "Welcome back"
    timeout: 30000
    optional: true

- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          id: "sign-in-button"
      - extendedWaitUntil:
          notVisible: "Welcome back"
          timeout: 30000

# === VERIFY OWNER DASHBOARD ===
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 60000

# === VERIFY OWNER PROFILE ===
- openLink: lalarenteapp:///(owner)/profile
- extendedWaitUntil:
    visible: "Owner Account"
    timeout: 20000
