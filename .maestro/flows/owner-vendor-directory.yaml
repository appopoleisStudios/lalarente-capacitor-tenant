# Plane #104 / #106 — owner vendor directory is reachable from Maintenance
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-owner.yaml
- runFlow: ../subflows/tap-owner-maintenance.yaml

- tapOn:
    id: 'owner-find-vendor'
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: 'vendor-directory-title'
    timeout: 20000

- assertVisible:
    id: 'tenant-vendor-search'
