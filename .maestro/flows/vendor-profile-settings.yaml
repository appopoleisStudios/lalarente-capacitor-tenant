# Vendor profile settings — Edit Profile / Notifications / Privacy wiring (Plane #71)
# All three Account Settings rows on VendorProfileScreen must navigate.
#
# The Account Settings rows sit BELOW the services/service-areas cards. On a
# populated vendor profile (services above the fold) a bare tapOn targets the
# element's off-screen center and never lands — scroll each row into full view
# first (same scrollUntilVisible pattern as the tenant messages subflow).
appId: com.lalarente.app
---
- runFlow: ../subflows/launch-app-warm.yaml
- runFlow: ../subflows/login-vendor.yaml
- runFlow: ../subflows/tap-vendor-profile.yaml

# 1. Edit Profile → edit screen (name/phone/avatar)
- scrollUntilVisible:
    element:
      id: "vendor-profile-edit"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: "vendor-profile-edit"
- extendedWaitUntil:
    visible: "Edit Profile"
    timeout: 15000
- tapOn:
    id: "edit-profile-back"
# Landing on the Profile tab is asserted via the fixed header testID
# (vendor-profile-title), NOT the 'Vendor Account' badge: the badge lives in
# the profile card ABOVE the scroll fold and the tab preserves its scroll
# offset, so it's off-screen after returning. The header is outside the
# ScrollView and is unique to the Profile screen (Dashboard has no such ID).
- extendedWaitUntil:
    visible:
      id: "vendor-profile-title"
    timeout: 15000

# 2. Notifications → notifications screen
- scrollUntilVisible:
    element:
      id: "vendor-profile-notifications"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: "vendor-profile-notifications"
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 15000
- tapOn:
    id: "notification-back"
- extendedWaitUntil:
    visible:
      id: "vendor-profile-title"
    timeout: 15000

# 3. Privacy → consent + data-rights screen
- scrollUntilVisible:
    element:
      id: "vendor-profile-privacy"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: "vendor-profile-privacy"
- extendedWaitUntil:
    visible: "Privacy & Consent"
    timeout: 15000
