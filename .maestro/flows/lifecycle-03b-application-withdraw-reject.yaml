# Lifecycle stage 3b — Application withdrawn by tenant, rejected by owner
# Covers LC-3-10, 3-11, 3-17, 3-23, 3-24. Uses the branch property.
# Env: creds, LC_BRANCH_PROPERTY_ID, LC_BRANCH_PROPERTY_TITLE, LC_TOKEN
appId: com.lalarente.app
---
- runFlow: ../subflows/login-tenant.yaml
- runFlow:
    file: ../subflows/lc-tenant-apply.yaml
    env:
      PROP_ID: "${LC_BRANCH_PROPERTY_ID}"
      PROP_TITLE: "${LC_BRANCH_PROPERTY_TITLE}"

# ── withdraw from My Applications: Cancel keeps it ────────────────────────
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "tenant-applications-withdraw"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
- tapOn:
    id: "tenant-applications-withdraw"
    index: 0
- extendedWaitUntil:
    visible: "Withdraw Application"
    timeout: 15000
- tapOn:
    text: "Cancel"
- assertVisible:
    id: "tenant-applications-withdraw"

# ── withdraw from the application detail screen ───────────────────────────
- openLink: lalarenteapp://(tenant)/properties/${LC_BRANCH_PROPERTY_ID}
- extendedWaitUntil:
    visible:
      id: "tenant-property-back"
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "tenant-property-view-application"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
- tapOn:
    id: "tenant-property-view-application"
- extendedWaitUntil:
    visible:
      id: "tenant-application-back"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "tenant-application-withdraw"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
- tapOn:
    id: "tenant-application-withdraw"
- extendedWaitUntil:
    visible: "Withdraw Application"
    timeout: 15000
- tapOn:
    text: "Withdraw"
- extendedWaitUntil:
    visible: "Success"
    timeout: 15000
- tapOn:
    text: "OK"
- waitForAnimationToEnd:
    timeout: 2000
- openLink: lalarenteapp://(tenant)/application-status
- extendedWaitUntil:
    visible: "My Applications"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: "(?i).*withdrawn.*"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
- takeScreenshot: lc03b-tenant-withdrawn
- waitForAnimationToEnd:
    timeout: 1500
- openLink: lalarenteapp://(tenant)/
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/sign-out-tenant.yaml

# ── owner sees it withdrawn with no actions ───────────────────────────────
- runFlow: ../subflows/login-owner.yaml
- runFlow:
    file: ../subflows/lc-owner-open-application.yaml
    env:
      PROP_TITLE: "${LC_BRANCH_PROPERTY_TITLE}"
- assertVisible: "(?i).*withdrawn.*"
- assertNotVisible:
    id: "owner-application-approve"
- assertNotVisible:
    id: "owner-application-reject"
- openLink: lalarenteapp://(owner)/
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/sign-out-owner.yaml

# ── tenant applies again; owner rejects with a reason ─────────────────────
- runFlow: ../subflows/login-tenant.yaml
- runFlow:
    file: ../subflows/lc-tenant-apply.yaml
    env:
      PROP_ID: "${LC_BRANCH_PROPERTY_ID}"
      PROP_TITLE: "${LC_BRANCH_PROPERTY_TITLE}"
- openLink: lalarenteapp://(tenant)/
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/sign-out-tenant.yaml
- runFlow: ../subflows/login-owner.yaml
- runFlow:
    file: ../subflows/lc-owner-open-application.yaml
    env:
      PROP_TITLE: "${LC_BRANCH_PROPERTY_TITLE}"
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: "owner-application-reject"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
- tapOn:
    id: "owner-application-reject"
- extendedWaitUntil:
    visible:
      id: "reason-input"
    timeout: 20000
- tapOn:
    id: "reason-input"
- inputText: "LC-reject ${LC_TOKEN}"
- tapOn:
    id: "reason-confirm"
- extendedWaitUntil:
    visible: "Success"
    timeout: 15000
- tapOn:
    text: "OK"
- waitForAnimationToEnd:
    timeout: 3000
- openLink: lalarenteapp://(owner)/
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/sign-out-owner.yaml
- runFlow: ../subflows/login-tenant.yaml
- openLink: lalarenteapp://(tenant)/application-status
- extendedWaitUntil:
    visible: "My Applications"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      text: ".*Not Selected.*"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
- takeScreenshot: lc03b-tenant-rejected
- waitForAnimationToEnd:
    timeout: 1500

# ── empty-state / browse button returns to search ─────────────────────────
- tapOn:
    id: "tenant-applications-browse"
    optional: true
- openLink: lalarenteapp://(tenant)/
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/sign-out-tenant.yaml
