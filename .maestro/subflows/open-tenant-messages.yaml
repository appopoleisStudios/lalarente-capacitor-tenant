# Open tenant messages list from dashboard Quick Actions
appId: com.lalarente.app
---
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 15000

- scrollUntilVisible:
    element: "Messages"
    direction: DOWN
    timeout: 20000

- tapOn:
    text: "See All"
    optional: true

- tapOn: "Messages"

- extendedWaitUntil:
    visible: "Messages"
    timeout: 15000
