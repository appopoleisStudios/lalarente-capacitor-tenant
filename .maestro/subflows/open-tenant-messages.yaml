# Open tenant messages via Home → Quick Action (no deep links).
appId: com.lalarente.app
---
- tapOn:
    id: "tab-home"

- extendedWaitUntil:
    visible: "Quick Actions"
    timeout: 20000

- tapOn:
    id: "qa-messages"

- extendedWaitUntil:
    visible:
      id: "tenant-messages-title"
    timeout: 45000
