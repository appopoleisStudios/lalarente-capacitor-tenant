# Open tenant messages via Home → Quick Action (no deep links).
appId: com.lalarente.app
---
# Let the tab bar settle before tapping Home (cold-start flake: the tab bar
# can still be animating in when this subflow runs right after launch).
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 20000

- tapOn:
    id: "tab-home"

# NOTE: do NOT hard-gate on the "Quick Actions" section title — on a cold
# start the E2E tenant's incomplete profile renders the tall "Complete Your
# Profile" card ABOVE the grid (TenantDashboardScreen), pushing the section
# below the fold. The in-viewport assert is optional; the scrollUntilVisible
# on qa-messages below is the real gate and navigates regardless of position.
- extendedWaitUntil:
    visible: "Quick Actions"
    timeout: 5000
    optional: true

- waitForAnimationToEnd:
    timeout: 10000

# MUST scroll the quick action into full view first: the Quick Actions grid
# reaches under the tab bar (tab bar = bottom 85px of a 852px screen), and a
# bare tapOn targets the element's center — which lands ON the tab bar and
# never navigates. Flow 20 uses the same scrollUntilVisible pattern.
- scrollUntilVisible:
    element:
      id: "qa-messages"
    direction: DOWN
    timeout: 20000
    centerElement: true

# Let the scroll momentum settle before tapping — a tap fired while the
# ScrollView is still moving lands on the wrong element (proven: screenshot
# showed the dashboard, not Messages). Same class as the #131 flake.
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: "qa-messages"

- extendedWaitUntil:
    visible:
      id: "tenant-messages-title"
    timeout: 45000
