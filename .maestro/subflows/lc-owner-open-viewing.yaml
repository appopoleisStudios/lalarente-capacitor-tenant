# Owner (already signed in) opens Viewing Requests and the request whose
# message contains MSG + LC_TOKEN.
# Env: LC_TOKEN, MSG
appId: com.lalarente.app
---
- openLink: lalarenteapp://(owner)/viewings
- extendedWaitUntil:
    visible: "Viewing Requests"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "owner-viewings-filter-all"
# The screen stays mounted and keeps its scroll offset; go back to the top so
# the newest card isn't hidden under the sticky filter header.
- repeat:
    times: 3
    commands:
      - swipe:
          start: "50%,45%"
          end: "50%,90%"
          duration: 300
# a swipe at the top of the list is a pull-to-refresh; let it settle
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "owner-viewing-card"
- waitForAnimationToEnd:
    timeout: 1500
# The card can be just above or below the viewport (pull-to-refresh offset):
# look up first, then down. Both optional; the tap below is the real check.
- scrollUntilVisible:
    element:
      text: ".*${MSG} ${LC_TOKEN}.*"
    direction: UP
    timeout: 6000
    visibilityPercentage: 50
    optional: true
- scrollUntilVisible:
    element:
      text: ".*${MSG} ${LC_TOKEN}.*"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: ".*${MSG} ${LC_TOKEN}.*"
- extendedWaitUntil:
    visible:
      id: "owner-viewing-detail-back"
    timeout: 20000
