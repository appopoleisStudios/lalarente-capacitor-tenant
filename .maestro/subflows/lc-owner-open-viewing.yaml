# Owner (already signed in) opens Viewing Requests and the request whose
# message contains MSG + LC_TOKEN.
# Env: LC_TOKEN, MSG
appId: com.lalarente.app
---
- openLink: lalarenteapp://(owner)/viewings
- extendedWaitUntil:
    visible: "Viewing Requests"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "owner-viewings-filter-all"
# The screen stays mounted and keeps its scroll offset; go back to the top so
# the newest card isn't hidden under the sticky filter header.
- repeat:
    times: 3
    commands:
      - swipe:
          start: "50%,45%"
          end: "50%,90%"
          duration: 300
- assertVisible:
    id: "owner-viewing-card"
- waitForAnimationToEnd:
    timeout: 1500
# Scroll only when needed: centering a card that is already first in the
# list pushes it under the sticky header and the tap misses.
- runFlow:
    when:
      notVisible: ".*${MSG} ${LC_TOKEN}.*"
    commands:
      - scrollUntilVisible:
          element:
            text: ".*${MSG} ${LC_TOKEN}.*"
          direction: DOWN
          timeout: 20000
          visibilityPercentage: 60
          centerElement: true
- tapOn:
    text: ".*${MSG} ${LC_TOKEN}.*"
- extendedWaitUntil:
    visible:
      id: "owner-viewing-detail-back"
    timeout: 20000
