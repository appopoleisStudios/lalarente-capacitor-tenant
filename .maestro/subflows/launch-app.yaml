# Fresh app start — forces login screen without clearState
# NOTE: Never use clearState: true — it wipes the Expo dev client's stored Metro server URL,
# causing the app to show a blank "waiting for connection" screen.
# Instead, stopApp (kills the process) + deep link navigates to auth/login.
appId: com.lalarente.app
---
- stopApp
- launchApp

# Open auth deep link to force navigation to login screen
- openLink: lalarenteapp:///auth/login

# Dismiss iOS system dialogs (permission prompts, keyboard toolbar, etc.)
- tapOn:
    text: "Not Now"
    optional: true

- tapOn:
    text: "Cancel"
    optional: true

- tapOn:
    text: "Allow"
    optional: true

- tapOn:
    text: "Don't Allow"
    optional: true

# If already authenticated (session from previous flow), the auth deep link will redirect
# to the dashboard. Detect this quickly to avoid waiting 120s for a login screen that
# won't appear. The login subflow that follows handles both logged-in and not-logged-in.
- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 10000
    optional: true

- runFlow:
    when:
      notVisible:
        id: "notification-bell"
    commands:
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 120000

      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 60000
