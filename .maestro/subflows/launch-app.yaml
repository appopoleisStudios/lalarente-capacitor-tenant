# Fresh app start — force login state without clearState
# NOTE: Never use clearState: true — it wipes the Expo dev client's stored Metro server URL,
# causing the app to show a blank "waiting for connection" screen.
# clearKeychain: true clears iOS SecureStore auth without touching Metro prefs.
# Prefer login-* subflows for role-aware session reset + credentials.
appId: com.lalarente.app
---
- stopApp
- launchApp:
    clearKeychain: true
    arguments:
      EXDevMenuIsOnboardingFinished: "true"

# If shake/relaunch still surfaced the Expo/RN developer menu, dismiss it.
- runFlow: dismiss-dev-menu.yaml

# Wait for app to initialize and connect to Metro before any interactions
- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 30000
    optional: true

- runFlow:
    when:
      notVisible:
        id: "notification-bell"
    commands:
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 120000
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 60000
