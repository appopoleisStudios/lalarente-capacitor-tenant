# Fresh app start — force login state without clearState
# NOTE: Never use clearState: true — it wipes the Expo dev client's stored Metro server URL,
# causing the app to show a blank "waiting for connection" screen.
# Instead: stopApp (clean process) + launchApp (preserves Metro URL).
# The app's root index.tsx already redirects to /auth/login when no session is active.
appId: com.lalarente.app
---
- stopApp
- launchApp

# Wait for app to initialize and connect to Metro before any interactions
# The app's root index.tsx auto-redirects to /auth/login on fresh start
- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 30000
    optional: true

- runFlow:
    when:
      notVisible:
        id: "notification-bell"
    commands:
      # Not logged in — wait for login screen to render
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 120000
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 60000
