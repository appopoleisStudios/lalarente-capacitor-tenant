# Fresh app start — clears persisted session so login subflows always see the sign-in screen
appId: com.lalarente.app
---
- launchApp:
    clearState: true

# Dismiss iOS system dialogs immediately (permission prompts, keyboard toolbar, etc.)
# before waiting for login screen — prevents dialogs from blocking element detection
- tapOn:
    text: "Not Now"
    optional: true

- tapOn:
    text: "Cancel"
    optional: true

- tapOn:
    text: "Allow"
    optional: true

- tapOn:
    text: "Don't Allow"
    optional: true

- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 120000

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 60000
