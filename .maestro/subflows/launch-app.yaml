# Fresh app start — clears persisted session so login subflows always see the sign-in screen
appId: com.lalarente.app
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 90000

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 30000

# iOS simulator system dialogs that block the login screen
- tapOn:
    text: "Not Now"
    optional: true

- tapOn:
    text: "Cancel"
    optional: true

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 15000
