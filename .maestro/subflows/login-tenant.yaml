# Reusable tenant login — skips if already on tenant dashboard
appId: com.lalarente.app
---
- runFlow:
    when:
      visible: "Welcome back,"
    commands:
      - assertVisible: "Welcome back,"

- runFlow:
    when:
      notVisible: "Welcome back,"
    commands:
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 15000
      - tapOn:
          id: "email-input"
      - inputText: ${TENANT_EMAIL}
      - pressKey: Enter
      - inputText: ${TENANT_PASSWORD}
      - hideKeyboard
      - tapOn:
          text: "Sign In"
      - extendedWaitUntil:
          visible: "Welcome back,"
          timeout: 45000
