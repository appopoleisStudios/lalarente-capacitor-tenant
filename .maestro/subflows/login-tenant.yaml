# Tenant login — TENANT_EMAIL/TENANT_PASSWORD from --env flags.
# No deep links.
# - If already on login (e.g. after sign-out-*), fill credentials only (no stopApp).
# - Otherwise: stopApp + launchApp(clearKeychain) then UI sign-out if needed.
# clearKeychain clears iOS SecureStore without clearState (which wipes Expo Metro URL).
appId: com.lalarente.app
---
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 5000
    optional: true

# Cold start path — not already on login
- runFlow:
    when:
      notVisible:
        id: "email-input"
    commands:
      - stopApp
      - launchApp:
          clearKeychain: true
          arguments:
            EXDevMenuIsOnboardingFinished: "true"
      - runFlow: dismiss-dev-menu.yaml

      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 45000
          optional: true

      - runFlow:
          when:
            notVisible: "Welcome back,"
          commands:
            - extendedWaitUntil:
                visible:
                  id: "email-input"
                timeout: 30000
                optional: true

      - runFlow:
          when:
            notVisible:
              id: "email-input"
          commands:
            - runFlow:
                when:
                  visible:
                    id: "tab-profile"
                commands:
                  - runFlow: sign-out-tenant.yaml

            - runFlow:
                when:
                  visible:
                    id: "tab-vendor-profile"
                commands:
                  - runFlow: sign-out-vendor.yaml

            - runFlow:
                when:
                  visible:
                    id: "tab-owner-profile"
                commands:
                  - runFlow: sign-out-owner.yaml

            - extendedWaitUntil:
                visible:
                  id: "email-input"
                timeout: 30000

# Fill credentials (cold or warm)
- tapOn:
    id: "email-input"
- eraseText
- inputText: ${TENANT_EMAIL}

- tapOn:
    text: "Sign in to your account"
    optional: true

- tapOn:
    id: "password-input"
- eraseText
- inputText: ${TENANT_PASSWORD}

- tapOn:
    text: "Sign in to your account"
    optional: true

- tapOn:
    id: "sign-in-button"

- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 90000
