# Tenant login — uses TENANT_EMAIL/TENANT_PASSWORD from .maestro/.env via --env flags.
# Detects whether the app is already logged in (session persisted in SecureStore)
# and only fills the login form if needed.
appId: com.lalarente.app
---
# Navigate to dashboard FIRST so we're on a known screen for session detection.
# Previous flows may have navigated to AI chat, maintenance, etc.
# Dashboard shows "Welcome back," (with comma) if logged in, or redirects to
# login screen ("Welcome back" without comma) if not logged in.
- openLink: lalarenteapp:///(tenant)/dashboard

# Wait for the app to settle on dashboard or redirect to login.
# 45s covers: Metro bundle load + SecureStore read + session restore + profile
# fetch (REST API with 10s timeout) + dashboard navigation + UI render.
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 45000
    optional: true

# Already logged in — done.
- runFlow:
    when:
      visible: "Welcome back,"
    commands:
      - assertVisible:
          text: "Welcome back,"
          optional: true

# Not logged in — go through login flow
- runFlow:
    when:
      notVisible: "Welcome back,"
    commands:
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 15000
      # Enter email
      - tapOn:
          id: "email-input"
      - eraseText
      - inputText: ${TENANT_EMAIL}
      # Enter password
      - tapOn:
          id: "password-input"
      - eraseText
      - inputText: ${TENANT_PASSWORD}
      # Tap Sign In
      - tapOn:
          id: "sign-in-button"
      # Wait for navigation to dashboard
      - extendedWaitUntil:
          visible: "Welcome back,"
          timeout: 60000
