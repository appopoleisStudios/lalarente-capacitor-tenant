# Reusable tenant login — skips if already on tenant dashboard
appId: com.lalarente.app
---
- runFlow:
    when:
      visible:
        id: "notification-bell"
    commands:
      - assertVisible:
          id: "notification-bell"

- runFlow:
    when:
      notVisible:
        id: "notification-bell"
    commands:
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 20000
      - tapOn:
          id: "email-input"
      - inputText: ${TENANT_EMAIL}
      - pressKey: Enter
      - inputText: ${TENANT_PASSWORD}
      - pressKey: Enter
      - extendedWaitUntil:
          visible:
            id: "notification-bell"
          timeout: 45000
      - assertVisible:
          id: "notification-bell"
