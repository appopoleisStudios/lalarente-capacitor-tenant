# Tenant login — uses TENANT_EMAIL/TENANT_PASSWORD from .maestro/.env via --env flags.
# Detects whether the app is already logged in (session persisted in SecureStore)
# and only fills the login form if needed.
appId: com.lalarente.app
---
# Navigate to tenant dashboard to trigger session detection
- openLink: lalarenteapp:///(tenant)/dashboard

# Wait up to 35s for session restore + dashboard render
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 35000
    optional: true

# If dashboard visible — already logged in, done
- runFlow:
    when:
      visible: "Welcome back,"
    commands:
      - assertVisible:
          text: "Welcome back,"
          optional: true

# Not on dashboard — must be on login screen, fill credentials
- runFlow:
    when:
      notVisible: "Welcome back,"
    commands:
      # Go directly to login screen by deep link
      - openLink: lalarenteapp:///auth/login
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 30000

      - tapOn:
          id: "email-input"
      - eraseText
      - inputText: ${TENANT_EMAIL}

      - tapOn:
          id: "password-input"
      - eraseText
      - inputText: ${TENANT_PASSWORD}

      # Wait briefly for React state to propagate after input
      - tapOn:
          id: "password-input"

      # Tap Sign In (button is only enabled when both fields non-empty)
      - tapOn:
          id: "sign-in-button"

      # Wait up to 60s for dashboard to appear after login
      - extendedWaitUntil:
          visible: "Welcome back,"
          timeout: 60000
