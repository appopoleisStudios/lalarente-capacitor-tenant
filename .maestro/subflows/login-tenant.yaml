# Reusable tenant login — skips if already on tenant dashboard
appId: com.lalarente.app
---
- runFlow:
    when:
      visible: "Your tenancy"
    commands:
      - assertVisible: "Your tenancy"

- runFlow:
    when:
      notVisible: "Your tenancy"
    commands:
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 15000
      - tapOn:
          id: "email-input"
      - inputText: ${TENANT_EMAIL}
      - pressKey: Enter
      - inputText: ${TENANT_PASSWORD}
      - pressKey: Enter
      - extendedWaitUntil:
          visible: "Your tenancy"
          timeout: 20000
