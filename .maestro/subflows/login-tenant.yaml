# Reusable tenant login — skips if already on tenant dashboard
appId: com.lalarente.app
---
- runFlow:
    when:
      visible: "Welcome Back"
    commands:
      - assertVisible: "Sign in to your account"
      - waitForAnimationToEnd:
          timeout: 3000
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 10000
      - tapOn:
          id: "email-input"
      - inputText: ${TENANT_EMAIL}
      - pressKey: Enter
      - inputText: ${TENANT_PASSWORD}
      - pressKey: Enter

- extendedWaitUntil:
    visible: "Your tenancy"
    timeout: 20000
