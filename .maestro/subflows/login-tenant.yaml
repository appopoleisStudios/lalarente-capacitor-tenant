# Tenant login — uses TENANT_EMAIL/TENANT_PASSWORD from .maestro/.env via --env flags.
# NOTE: Uses text-based selectors instead of testIDs because the simulator app build
# is stale and doesn't have the latest testIDs. After a fresh native rebuild, consider
# switching back to id: selectors for reliability.
appId: com.lalarente.app
---
- openLink: lalarenteapp:///(tenant)/dashboard

- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 30000
    optional: true

- runFlow:
    when:
      visible:
        id: "notification-bell"
    commands:
      - assertVisible:
          id: "notification-bell"

- runFlow:
    when:
      notVisible:
        id: "notification-bell"
    commands:
      # Wait for the login screen to appear (text-based)
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 30000
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 15000
      # Tap the email field by its placeholder text
      - tapOn: "your@email.com"
      - inputText: ${TENANT_EMAIL}
      - pressKey: Enter
      # Tap the password field by its placeholder text
      - tapOn: "Enter your password"
      - inputText: ${TENANT_PASSWORD}
      - pressKey: Enter
      # Wait for dashboard to appear
      - extendedWaitUntil:
          visible:
            id: "notification-bell"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "notification-bell"
          commands:
            # Tap the Sign In button by text
            - tapOn:
                text: "Sign In"
                optional: true
            - extendedWaitUntil:
                visible:
                  id: "notification-bell"
                timeout: 60000
      - assertVisible:
          id: "notification-bell"
