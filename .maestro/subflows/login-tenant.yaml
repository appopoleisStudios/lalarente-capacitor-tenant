# Ensure Navin tenant QA account (TENANT_EMAIL) — never reuse a stale/wrong session.
appId: com.lalarente.app
---
- openLink: lalarenteapp:///(tenant)/dashboard

- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 15000
    optional: true

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 5000
    optional: true

# Signed in as someone else → sign out before login
- runFlow:
    when:
      visible:
        id: "notification-bell"
    commands:
      - openLink: lalarenteapp:///(tenant)/profile
      - extendedWaitUntil:
          visible:
            id: "tenant-profile-title"
          timeout: 20000
      - runFlow:
          when:
            notVisible: ${TENANT_EMAIL}
          commands:
            - scrollUntilVisible:
                element: "Sign Out"
                direction: DOWN
                timeout: 15000
            - tapOn: "Sign Out"
            - tapOn: "Sign Out"
            - extendedWaitUntil:
                visible:
                  id: "email-input"
                timeout: 30000

- runFlow:
    when:
      visible:
        id: "email-input"
    commands:
      - tapOn:
          id: "email-input"
      - inputText: ${TENANT_EMAIL}
      - pressKey: Enter
      - inputText: ${TENANT_PASSWORD}
      - pressKey: Enter
      - extendedWaitUntil:
          visible:
            id: "notification-bell"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "notification-bell"
          commands:
            - tapOn:
                id: "sign-in-button"
            - extendedWaitUntil:
                visible:
                  id: "notification-bell"
                timeout: 60000
      - assertVisible:
          id: "notification-bell"

- openLink: lalarenteapp:///(tenant)/profile
- extendedWaitUntil:
    visible:
      id: "tenant-profile-title"
    timeout: 20000
- assertVisible: ${TENANT_EMAIL}

- openLink: lalarenteapp:///(tenant)/dashboard
- assertVisible:
    id: "notification-bell"
