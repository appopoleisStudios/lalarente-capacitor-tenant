# Reusable tenant login — skips if already on tenant dashboard
appId: com.lalarente.app
---
- runFlow:
    when:
      visible: "Welcome back,"
    commands:
      - assertVisible: "Welcome back,"

- runFlow:
    when:
      notVisible: "Welcome back,"
    commands:
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 20000
      - tapOn:
          id: "email-input"
      - inputText: ${TENANT_EMAIL}
      - pressKey: Enter
      - inputText: ${TENANT_PASSWORD}
      - hideKeyboard
      - tapOn:
          text: "Sign In"
      - extendedWaitUntil:
          visible: "Welcome back,"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            visible: "Sign In"
          commands:
            - tapOn:
                text: "Sign In"
            - extendedWaitUntil:
                visible: "Welcome back,"
                timeout: 60000
      - assertVisible: "Welcome back,"
