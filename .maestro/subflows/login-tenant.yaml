# Reusable tenant login — skips if already on tenant dashboard
appId: com.lalarente.app
---
- openLink: lalarenteapp:///(tenant)/dashboard

- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 30000
    optional: true

- runFlow:
    when:
      visible:
        id: "notification-bell"
    commands:
      - assertVisible:
          id: "notification-bell"

- runFlow:
    when:
      notVisible:
        id: "notification-bell"
    commands:
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 30000
      - tapOn:
          id: "email-input"
      - inputText: ${TENANT_EMAIL}
      - pressKey: Enter
      - inputText: ${TENANT_PASSWORD}
      - pressKey: Enter
      - extendedWaitUntil:
          visible:
            id: "notification-bell"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "notification-bell"
          commands:
            - tapOn:
                id: "sign-in-button"
            - extendedWaitUntil:
                visible:
                  id: "notification-bell"
                timeout: 60000
                optional: true
      - runFlow:
          when:
            notVisible:
              id: "notification-bell"
          commands:
            - tapOn:
                id: "email-input"
            - inputText: ${TENANT_EMAIL}
            - pressKey: Enter
            - inputText: ${TENANT_PASSWORD}
            - tapOn:
                id: "sign-in-button"
            - extendedWaitUntil:
                visible:
                  id: "notification-bell"
                timeout: 60000
      - assertVisible:
          id: "notification-bell"
