# Owner login — uses OWNER_EMAIL/OWNER_PASSWORD from .maestro/.env via --env flags.
# Uses launchApp with clearState to force a fresh login as owner.
appId: com.lalarente.app
---
# Force fresh state so we always see the login screen
- launchApp:
    clearState: true
    stopApp: true

# Wait for login screen
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000

# Enter owner credentials
- tapOn:
    id: "email-input"
- eraseText
- inputText: ${OWNER_EMAIL}

- tapOn:
    id: "password-input"
- eraseText
- inputText: ${OWNER_PASSWORD}

# Tap Sign In
- tapOn:
    id: "sign-in-button"

# Wait for owner dashboard
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 60000
    optional: true
- extendedWaitUntil:
    visible: "Welcome to LaLarente"
    timeout: 60000
    optional: true

# Navigate to profile and verify
- openLink: lalarenteapp:///(owner)/profile
- extendedWaitUntil:
    visible: "Owner Account"
    timeout: 15000
    optional: true
