# Owner login — uses OWNER_EMAIL/OWNER_PASSWORD from .maestro/.env via --env flags.
appId: com.lalarente.app
---
# Wait for login screen
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 45000

# Enter owner credentials (same pattern as tenant login)
- tapOn:
    id: "email-input"
- eraseText
- inputText: ${OWNER_EMAIL}

- tapOn:
    id: "password-input"
- eraseText
- inputText: ${OWNER_PASSWORD}

# Tap Sign In
- tapOn:
    id: "sign-in-button"

# Wait for owner dashboard
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 60000
    optional: true

# Navigate to profile and verify
- openLink: lalarenteapp:///(owner)/profile
- extendedWaitUntil:
    visible: "Owner Account"
    timeout: 15000
    optional: true
