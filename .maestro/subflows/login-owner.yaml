appId: com.lalarente.app
---
- runFlow:
    when:
      visible: "Portfolio Dashboard"
    commands:
      - assertVisible: "Portfolio Dashboard"

- runFlow:
    when:
      notVisible: "Portfolio Dashboard"
    commands:
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 20000
      - tapOn:
          id: "email-input"
      - inputText: ${OWNER_EMAIL}
      - pressKey: Enter
      - inputText: ${OWNER_PASSWORD}
      - hideKeyboard
      - tapOn:
          text: "Sign In"
      - extendedWaitUntil:
          visible: "Portfolio Dashboard"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            visible: "Sign In"
          commands:
            - tapOn:
                text: "Sign In"
            - extendedWaitUntil:
                visible: "Portfolio Dashboard"
                timeout: 60000
      - assertVisible: "Portfolio Dashboard"
