# Owner login — uses OWNER_EMAIL/OWNER_PASSWORD from .maestro/.env via --env flags.
# For explicit sign-out, then logs in as owner with fresh app state.
appId: com.lalarente.app
---
# Check if we're on the login screen or already logged in
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
    optional: true

- runFlow:
    when:
      notVisible: "Welcome back"
    commands:
      # Already logged in — sign out first
      - openLink: lalarenteapp:///(tenant)/profile
      - extendedWaitUntil:
          visible: "Profile"
          timeout: 30000
          optional: true
      - extendedWaitUntil:
          visible: "Sign Out"
          timeout: 30000
          optional: true
      - tapOn:
          text: "Sign Out"
          optional: true
      # Wait briefly for sign-out, then force-navigate to login screen
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 15000
          optional: true
      # If still not on login screen, navigate there directly
      - runFlow:
          when:
            notVisible: "Welcome back"
          commands:
            - stopApp
            - launchApp

# Wait for login screen email field to be visible (mandatory)
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 30000

# Enter owner credentials
- tapOn:
    id: "email-input"
- eraseText
- inputText: ${OWNER_EMAIL}
- pressKey: Enter

- tapOn:
    id: "password-input"
- eraseText
- inputText: ${OWNER_PASSWORD}

# Tap Sign In
- tapOn:
    id: "sign-in-button"

# Wait for owner dashboard
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 60000
    optional: true
- extendedWaitUntil:
    visible: "Welcome to LaLarente"
    timeout: 60000
    optional: true

# Navigate to profile and verify
- openLink: lalarenteapp:///(owner)/profile
- extendedWaitUntil:
    visible: "Owner Account"
    timeout: 15000
    optional: true
