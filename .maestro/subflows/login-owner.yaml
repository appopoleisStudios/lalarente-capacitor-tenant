# Owner login — uses OWNER_EMAIL/OWNER_PASSWORD from .maestro/.env via --env flags.
# Signs out any existing session, then logs in as owner.
appId: com.lalarente.app
---
# Stop app to ensure fresh launch
- stopApp
- launchApp

# Check if we need to sign out (already logged in as someone else)
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
    optional: true

- runFlow:
    when:
      notVisible: "Welcome back"
    commands:
      # Already logged in — navigate to profile to sign out
      - openLink: lalarenteapp:///(tenant)/profile
      - extendedWaitUntil:
          visible: "Sign Out"
          timeout: 30000
          optional: true
      - tapOn:
          text: "Sign Out"
          optional: true
      # Wait for login screen after sign-out
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 30000
          optional: true

# Now on login screen — enter owner credentials
- tapOn:
    id: "email-input"
- eraseText
- inputText: ${OWNER_EMAIL}

- tapOn:
    id: "password-input"
- eraseText
- inputText: ${OWNER_PASSWORD}

# Tap Sign In
- tapOn:
    id: "sign-in-button"

# Wait for owner dashboard
- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 60000
    optional: true
- extendedWaitUntil:
    visible: "Welcome to LaLarente"
    timeout: 60000
    optional: true

# Navigate to profile and verify
- openLink: lalarenteapp:///(owner)/profile
- extendedWaitUntil:
    visible: "Owner Account"
    timeout: 15000
    optional: true
