appId: com.lalarente.app
---
- runFlow:
    when:
      visible: "Portfolio Dashboard"
    commands:
      - assertVisible: "Portfolio Dashboard"

- runFlow:
    when:
      notVisible: "Portfolio Dashboard"
    commands:
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 20000
      - tapOn:
          id: "email-input"
      - inputText: ${OWNER_EMAIL}
      - pressKey: Enter
      - inputText: ${OWNER_PASSWORD}
      - pressKey: Enter
      - extendedWaitUntil:
          visible: "Portfolio Dashboard"
          timeout: 45000
      - assertVisible: "Portfolio Dashboard"
