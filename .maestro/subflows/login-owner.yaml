appId: com.lalarente.app
---
- assertVisible: "Welcome Back"

- tapOn:
    id: "email-input"
- inputText: ${OWNER_EMAIL}

- hideKeyboard

- tapOn:
    id: "password-input"
- inputText: ${OWNER_PASSWORD}

- hideKeyboard
- tapOn: "Sign In"

- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 20000
