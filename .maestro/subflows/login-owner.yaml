# Ensure Navin owner QA account (OWNER_EMAIL) — never reuse a stale/wrong session.
appId: com.lalarente.app
---
- openLink: lalarenteapp:///(owner)/dashboard

- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 15000
    optional: true

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 5000
    optional: true

- runFlow:
    when:
      visible: "Portfolio Dashboard"
    commands:
      - openLink: lalarenteapp:///(owner)/profile
      - extendedWaitUntil:
          visible: "Owner Account"
          timeout: 20000
      - runFlow:
          when:
            notVisible: ${OWNER_EMAIL}
          commands:
            - scrollUntilVisible:
                element: "Logout"
                direction: DOWN
                timeout: 15000
            - tapOn: "Logout"
            - tapOn: "Logout"
            - extendedWaitUntil:
                visible:
                  id: "email-input"
                timeout: 30000

- runFlow:
    when:
      visible:
        id: "email-input"
    commands:
      - tapOn:
          id: "email-input"
      - inputText: ${OWNER_EMAIL}
      - pressKey: Enter
      - inputText: ${OWNER_PASSWORD}
      - pressKey: Enter
      - extendedWaitUntil:
          visible: "Portfolio Dashboard"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            notVisible: "Portfolio Dashboard"
          commands:
            - tapOn:
                id: "sign-in-button"
            - extendedWaitUntil:
                visible: "Portfolio Dashboard"
                timeout: 60000
      - assertVisible: "Portfolio Dashboard"

- openLink: lalarenteapp:///(owner)/profile
- assertVisible: ${OWNER_EMAIL}
- assertVisible: "Owner Account"

- openLink: lalarenteapp:///(owner)/dashboard
- assertVisible: "Portfolio Dashboard"
