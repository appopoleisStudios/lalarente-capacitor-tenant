# Owner login — OWNER_EMAIL/OWNER_PASSWORD from --env flags.
# No deep links. Skips stopApp when already on login (safe mid-suite role switch).
appId: com.lalarente.app
---
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 5000
    optional: true

# Already on owner dashboard
- runFlow:
    when:
      visible: ".*Portfolio Dashboard.*"
    commands:
      - assertVisible:
          text: ".*Portfolio Dashboard.*"

# Need login
- runFlow:
    when:
      notVisible: ".*Portfolio Dashboard.*"
    commands:
      - runFlow:
          when:
            notVisible:
              id: "email-input"
          commands:
            - stopApp
            - launchApp:
                clearKeychain: true
                arguments:
                  EXDevMenuIsOnboardingFinished: "true"
            - runFlow: dismiss-dev-menu.yaml

            - extendedWaitUntil:
                visible: ".*Portfolio Dashboard.*"
                timeout: 45000
                optional: true

            - runFlow:
                when:
                  notVisible: ".*Portfolio Dashboard.*"
                commands:
                  - extendedWaitUntil:
                      visible:
                        id: "email-input"
                      timeout: 15000
                      optional: true

            - runFlow:
                when:
                  notVisible:
                    id: "email-input"
                commands:
                  - runFlow:
                      when:
                        visible:
                          id: "tab-profile"
                      commands:
                        - runFlow: sign-out-tenant.yaml

                  - runFlow:
                      when:
                        visible:
                          id: "tab-vendor-profile"
                      commands:
                        - runFlow: sign-out-vendor.yaml

                  - runFlow:
                      when:
                        visible:
                          id: "tab-owner-profile"
                      commands:
                        - runFlow: sign-out-owner.yaml

                  - extendedWaitUntil:
                      visible:
                        id: "email-input"
                      timeout: 30000

      - runFlow:
          when:
            notVisible: ".*Portfolio Dashboard.*"
          commands:
            - tapOn:
                id: "email-input"
            - eraseText
            - inputText: ${OWNER_EMAIL}

            - tapOn:
                id: "password-input"
            - eraseText
            - inputText: ${OWNER_PASSWORD}

            - tapOn:
                id: "sign-in-button"

            - extendedWaitUntil:
                visible: ".*Portfolio Dashboard.*"
                timeout: 90000
