appId: com.lalarente.app
---
- openLink: lalarenteapp:///(owner)/dashboard

- extendedWaitUntil:
    visible: "Portfolio Dashboard"
    timeout: 30000
    optional: true

- runFlow:
    when:
      visible: "Portfolio Dashboard"
    commands:
      - assertVisible: "Portfolio Dashboard"

- runFlow:
    when:
      notVisible: "Portfolio Dashboard"
    commands:
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 30000
      - tapOn:
          id: "email-input"
      - inputText: ${OWNER_EMAIL}
      - pressKey: Enter
      - inputText: ${OWNER_PASSWORD}
      - pressKey: Enter
      - extendedWaitUntil:
          visible: "Portfolio Dashboard"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            notVisible: "Portfolio Dashboard"
          commands:
            - tapOn:
                id: "sign-in-button"
            - extendedWaitUntil:
                visible: "Portfolio Dashboard"
                timeout: 60000
      - assertVisible: "Portfolio Dashboard"
