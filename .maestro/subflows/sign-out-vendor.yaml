# Sign out a vendor session via Profile tab (no deep links).
# Hard asserts — fails if logout did not complete.
appId: com.lalarente.app
---
# Force navigation to tabs root — openLink avoids being stuck on
# non-tabbed modal routes (contracts, banking, etc.) where profile tab
# is not visible.
- openLink: lalarenteapp://(vendor)/
- waitForAnimationToEnd:
    timeout: 2500

- tapOn:
    id: "tab-vendor-profile"

- waitForAnimationToEnd:
    timeout: 2500

- scrollUntilVisible:
    element:
      text: ".*Logout.*"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50

- waitForAnimationToEnd:
    timeout: 1500

- tapOn:
    text: ".*Logout.*"

- extendedWaitUntil:
    visible: ".*Are you sure.*"
    timeout: 10000

# Alert confirmation — alert has title "Logout" AND button "Logout"; index: 1 targets
# the button (index 0 is the non-tappable title).
- tapOn:
    text: "Logout"
    index: 1

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 30000

- assertVisible:
    text: "Sign in to your account"
