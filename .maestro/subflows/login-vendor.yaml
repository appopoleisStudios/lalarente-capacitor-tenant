# Vendor login — uses VENDOR_EMAIL/VENDOR_PASSWORD from .maestro/.env via --env flags.
# Detects whether the app is already logged in (session persisted in SecureStore)
# and only fills the login form if needed.
appId: com.lalarente.app
---
# Navigate to vendor dashboard FIRST so we're on a known screen for session detection.
# Previous flows may have navigated elsewhere. Dashboard shows notification-bell
# if logged in as vendor, or redirects to login screen if not.
- openLink: lalarenteapp:///(vendor)/dashboard

# Wait for the app to settle on dashboard or redirect to login.
- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 45000
    optional: true

# Already logged in — done.
- runFlow:
    when:
      visible:
        id: "notification-bell"
    commands:
      - assertVisible:
          id: "notification-bell"

# Not logged in — go through login flow
- runFlow:
    when:
      notVisible:
        id: "notification-bell"
    commands:
      # Go directly to login screen by deep link
      - openLink: lalarenteapp:///auth/login
      - extendedWaitUntil:
          visible:
            id: "email-input"
          timeout: 30000

      - tapOn:
          id: "email-input"
      - eraseText
      - inputText: ${VENDOR_EMAIL}

      - tapOn:
          id: "password-input"
      - eraseText
      - inputText: ${VENDOR_PASSWORD}

      # Wait briefly for React state to propagate after input
      - tapOn:
          id: "password-input"

      # Tap Sign In (button is only enabled when both fields non-empty)
      - tapOn:
          id: "sign-in-button"

      # Wait for navigation to vendor dashboard
      - extendedWaitUntil:
          visible:
            id: "notification-bell"
          timeout: 60000
