# Vendor login — VENDOR_EMAIL/VENDOR_PASSWORD from --env flags.
# No deep links. Skips stopApp when already on login (safe mid-suite role switch).
appId: com.lalarente.app
---
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 5000
    optional: true

- runFlow:
    when:
      notVisible:
        id: "email-input"
    commands:
      - stopApp
      - launchApp:
          clearKeychain: true
          arguments:
            EXDevMenuIsOnboardingFinished: "true"
      - runFlow: dismiss-dev-menu.yaml

      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 45000
          optional: true

      - runFlow:
          when:
            notVisible: "Welcome back,"
          commands:
            - extendedWaitUntil:
                visible:
                  id: "email-input"
                timeout: 30000
                optional: true

      - runFlow:
          when:
            notVisible:
              id: "email-input"
          commands:
            - runFlow:
                when:
                  visible:
                    id: "tab-profile"
                commands:
                  - runFlow: sign-out-tenant.yaml

            - runFlow:
                when:
                  visible:
                    id: "tab-vendor-profile"
                commands:
                  - runFlow: sign-out-vendor.yaml

            - runFlow:
                when:
                  visible:
                    id: "tab-owner-profile"
                commands:
                  - runFlow: sign-out-owner.yaml

            - extendedWaitUntil:
                visible:
                  id: "email-input"
                timeout: 30000

- tapOn:
    id: "email-input"
- eraseText
- inputText: ${VENDOR_EMAIL}

- tapOn:
    text: "Sign in to your account"
    optional: true

- tapOn:
    id: "password-input"
- eraseText
- inputText: ${VENDOR_PASSWORD}

- tapOn:
    text: "Sign in to your account"
    optional: true

- tapOn:
    id: "sign-in-button"

- extendedWaitUntil:
    visible: ".*Quotes.*"
    timeout: 90000
