# Warm app start — keeps session (for Maestro record mode between flows)
appId: com.lalarente.app
---
- launchApp

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000
    optional: true

- tapOn:
    text: "Not Now"
    optional: true

- tapOn:
    text: "Cancel"
    optional: true
