# Warm app start — keeps session between flows in a suite run
# Login subflows (login-tenant.yaml, login-owner.yaml) handle their own navigation.
appId: com.lalarente.app
---
- launchApp
- runFlow: dismiss-dev-menu.yaml

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 15000
    optional: true

- extendedWaitUntil:
    visible:
      id: "notification-bell"
    timeout: 15000
    optional: true

- tapOn:
    text: "Not Now"
    optional: true

- tapOn:
    text: "Cancel"
    optional: true
