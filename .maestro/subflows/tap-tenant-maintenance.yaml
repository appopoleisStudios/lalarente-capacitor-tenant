# Scroll to Quick Actions → Maintenance (below fold on tenant dashboard)
appId: com.lalarente.app
---
- extendedWaitUntil:
    visible:
        id: "tenant-dashboard-header"
    timeout: 15000

- scrollUntilVisible:
    element: "Maintenance"
    direction: DOWN
    timeout: 20000

- tapOn: "Maintenance"
