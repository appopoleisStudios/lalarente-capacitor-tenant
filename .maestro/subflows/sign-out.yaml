# Sign out of any profile — clears cached session so next flow starts on login screen
# Works for tenant ("Sign Out"), owner ("Logout"), and vendor ("Logout")
# Strategy: stopApp+launchApp → wait for dashboard → deep link to profile → tap signout button → confirm alert
appId: com.lalarente.app
---
# ── Step 1: Restart to known state ──
- stopApp
- launchApp

# Wait for either dashboard or login screen (whichever comes first)
# Dashboard shows "Welcome back," (with comma), login shows "Welcome back" (no comma)
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 120000
    optional: true

# ── Step 2: If we landed on login screen, we're already signed out ──
- runFlow:
    when:
      visible: "Sign in to your account"
    commands:
      - assertVisible:
          text: "Sign in to your account"
      # Already signed out — nothing more to do

# ── Step 3: We're on dashboard — navigate to profile ──
- runFlow:
    when:
      notVisible: "Sign in to your account"
    commands:
      # Try tenant profile first (most common)
      - openLink: lalarenteapp:///(tenant)/profile
      - extendedWaitUntil:
          visible: "My Profile"
          timeout: 30000
          optional: true

      # If not tenant, try owner profile
      - runFlow:
          when:
            notVisible: "My Profile"
          commands:
            - openLink: lalarenteapp:///(owner)/profile
            - extendedWaitUntil:
                visible: "Profile"
                timeout: 20000
                optional: true

      # If not owner either, try vendor profile
      - runFlow:
          when:
            notVisible: "Profile"
          commands:
            - openLink: lalarenteapp:///(vendor)/profile/index
            - extendedWaitUntil:
                visible: "Profile"
                timeout: 20000
                optional: true

      # ── Step 4: Scroll to sign-out/logout button ──
      # Try "Sign Out" (tenant) first
      - scrollUntilVisible:
          element:
            text: "Sign Out"
          direction: DOWN
          timeout: 15000
          optional: true

      # If not found, try "Logout" (owner/vendor)
      - runFlow:
          when:
            notVisible: "Sign Out"
          commands:
            - scrollUntilVisible:
                element:
                  text: "Logout"
                direction: DOWN
                timeout: 15000
                optional: true

      # ── Step 5: Tap the sign-out button ──
      - tapOn:
          text: "Sign Out"
          optional: true
      - tapOn:
          text: "Logout"
          optional: true

      # ── Step 6: Confirm alert ──
      - extendedWaitUntil:
          visible: "Are you sure"
          timeout: 10000
          optional: true

      - tapOn:
          text: "Sign Out"
          optional: true
      - tapOn:
          text: "Logout"
          optional: true

      # ── Step 7: Wait for login screen ──
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 30000
