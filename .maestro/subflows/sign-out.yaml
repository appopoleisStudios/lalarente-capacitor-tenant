# Sign out of any profile — clears cached session so next flow starts on login screen
# Works for tenant ("Sign Out"), owner ("Logout"), and vendor ("Logout")
# Strategy: stopApp+launchApp → settle → detect screen → sign out if needed
appId: com.lalarente.app
---
# ── Step 1: Restart to known state ──
- stopApp
- launchApp

# ── Step 1a: Quick check — are we already on the login screen? ──
# Short timeout (5s) first. If we're on login (no session), we're done fast.
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 5000
    optional: true

# Already on login screen — already signed out. Fast path.
- runFlow:
    when:
      visible: "Sign in to your account"
    commands:
      - assertVisible:
          text: "Sign in to your account"
          optional: true
      # Done — nothing more to do

# ── Step 1b: Not on login — wait for Metro + auto-redirect ──
# Cached session: app briefly shows login screen ("Welcome back" no comma)
# then auto-redirects to dashboard ("Welcome back," with comma).
- runFlow:
    when:
      notVisible: "Sign in to your account"
    commands:
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 120000
          optional: true

      # Small pause for any auto-redirect to finish
      - tapOn:
          text: "Not Now"
          optional: true
      - tapOn:
          text: "Cancel"
          optional: true

      # Wait for auto-redirect to complete (dashboard with comma)
      - extendedWaitUntil:
          visible: "Welcome back,"
          timeout: 10000
          optional: true

      # ── Step 2: Check if we're on the login screen ──
# If "Sign in to your account" is visible after the settle period,
# we're genuinely on the login screen (no cached session). Done.
- runFlow:
    when:
      visible: "Sign in to your account"
    commands:
      - assertVisible:
          text: "Sign in to your account"
          optional: true

# ── Step 3: We're on dashboard — need to sign out ──
- runFlow:
    when:
      notVisible: "Sign in to your account"
    commands:
      # Try tenant profile first (most common)
      - openLink: lalarenteapp:///(tenant)/profile
      - extendedWaitUntil:
          visible: "My Profile"
          timeout: 30000
          optional: true

      # If not tenant, try owner profile
      - runFlow:
          when:
            notVisible: "My Profile"
          commands:
            - openLink: lalarenteapp:///(owner)/profile
            - extendedWaitUntil:
                visible: "Profile"
                timeout: 20000
                optional: true

      # If not owner either, try vendor profile
      - runFlow:
          when:
            notVisible: "Profile"
          commands:
            - openLink: lalarenteapp:///(vendor)/profile/index
            - extendedWaitUntil:
                visible: "Profile"
                timeout: 20000
                optional: true

      # ── Step 4: Scroll to sign-out/logout button ──
      # Try "Sign Out" (tenant) first
      - scrollUntilVisible:
          element:
            text: "Sign Out"
          direction: DOWN
          timeout: 15000
          optional: true

      # If not found, try "Logout" (owner/vendor)
      - runFlow:
          when:
            notVisible: "Sign Out"
          commands:
            - scrollUntilVisible:
                element:
                  text: "Logout"
                direction: DOWN
                timeout: 15000
                optional: true

      # ── Step 5: Tap the sign-out button ──
      - tapOn:
          text: "Sign Out"
          optional: true
      - tapOn:
          text: "Logout"
          optional: true

      # ── Step 6: Confirm alert ──
      - extendedWaitUntil:
          visible: "Are you sure"
          timeout: 10000
          optional: true

      - tapOn:
          text: "Sign Out"
          optional: true
      - tapOn:
          text: "Logout"
          optional: true

      # ── Step 7: Wait for login screen ──
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 30000
