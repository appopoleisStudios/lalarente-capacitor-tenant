# Sign out of any profile — clears cached session so next flow starts on login screen
# Works for tenant ("Sign Out"), owner ("Logout"), and vendor ("Logout")
# Strategy: stopApp+launchApp → settle → detect screen → sign out if needed
appId: com.lalarente.app
---
# ── Step 1: Restart to known state and settle ──
- stopApp
- launchApp

# Wait for Metro bundle to load and the app to settle into its final screen.
# If there's a cached session, the app may briefly flash the login screen
# before auto-redirecting to dashboard. We wait long enough for any
# auto-redirect to complete before checking the final state.
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 120000
    optional: true

# Small pause for any auto-redirect to finish (cached session redirect)
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true

# ── Step 2: Check if we're on the login screen ──
# If "Sign in to your account" is visible after the settle period,
# we're genuinely on the login screen (no cached session). Done.
- runFlow:
    when:
      visible: "Sign in to your account"
    commands:
      # Already signed out — nothing more to do

# ── Step 3: We're on dashboard — need to sign out ──
- runFlow:
    when:
      notVisible: "Sign in to your account"
    commands:
      # Try tenant profile first (most common)
      - openLink: lalarenteapp:///(tenant)/profile
      - extendedWaitUntil:
          visible: "My Profile"
          timeout: 30000
          optional: true

      # If not tenant, try owner profile
      - runFlow:
          when:
            notVisible: "My Profile"
          commands:
            - openLink: lalarenteapp:///(owner)/profile
            - extendedWaitUntil:
                visible: "Profile"
                timeout: 20000
                optional: true

      # If not owner either, try vendor profile
      - runFlow:
            when:
              notVisible: "Profile"
            commands:
              - openLink: lalarenteapp:///(vendor)/profile/index
              - extendedWaitUntil:
                  visible: "Profile"
                  timeout: 20000
                  optional: true

      # ── Step 4: Scroll to sign-out/logout button ──
      # Try "Sign Out" (tenant) first
      - scrollUntilVisible:
          element:
            text: "Sign Out"
          direction: DOWN
          timeout: 15000
          optional: true

      # If not found, try "Logout" (owner/vendor)
      - runFlow:
          when:
            notVisible: "Sign Out"
          commands:
            - scrollUntilVisible:
                element:
                  text: "Logout"
                direction: DOWN
                timeout: 15000
                optional: true

      # ── Step 5: Tap the sign-out button ──
      - tapOn:
          text: "Sign Out"
          optional: true
      - tapOn:
          text: "Logout"
          optional: true

      # ── Step 6: Confirm alert ──
      - extendedWaitUntil:
          visible: "Are you sure"
          timeout: 10000
          optional: true

      - tapOn:
          text: "Sign Out"
          optional: true
      - tapOn:
          text: "Logout"
          optional: true

      # ── Step 7: Wait for login screen ──
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 30000
