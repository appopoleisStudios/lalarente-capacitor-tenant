# Clear any cached session so the next login subflow starts clean.
# Detects role via tab testIDs / dashboard markers, then runs matching hard sign-out.
# Prefer sign-out-tenant / sign-out-vendor / sign-out-owner when role is known.
#
# No deep links (unreliable). No stopApp (can kill XCUITest mid-suite).
appId: com.lalarente.app
---
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 8000
    optional: true

# Already signed out
- runFlow:
    when:
      visible:
        id: "email-input"
    commands:
      - assertVisible:
          id: "email-input"

# Tenant session
- runFlow:
    when:
      visible:
        id: "tab-profile"
    commands:
      - runFlow: sign-out-tenant.yaml

# Vendor session
- runFlow:
    when:
      visible:
        id: "tab-vendor-profile"
    commands:
      - runFlow: sign-out-vendor.yaml

# Owner session
- runFlow:
    when:
      visible:
        id: "tab-owner-profile"
    commands:
      - runFlow: sign-out-owner.yaml

# Fallback markers if tabs not yet painted
- runFlow:
    when:
      notVisible:
        id: "email-input"
    commands:
      - runFlow:
          when:
            visible: "Welcome back,"
          commands:
            - runFlow: sign-out-tenant.yaml

      - runFlow:
          when:
            visible: ".*Quotes.*"
          commands:
            - runFlow: sign-out-vendor.yaml

      - runFlow:
          when:
            visible: ".*Portfolio Dashboard.*"
          commands:
            - runFlow: sign-out-owner.yaml

# Final gate — must be on login before any subsequent login-* subflow
- assertVisible:
    id: "email-input"
