# Sign out of any profile — clears cached session so next flow starts on login screen
# Works for tenant ("Sign Out"), owner ("Logout"), and vendor ("Logout")
# IMPORTANT: Never use stopApp/launchApp — it kills the XCUITest driver and causes
# kAXErrorInvalidUIElement crash. Use openLink to navigate instead.
appId: com.lalarente.app
---
# Step 1: Navigate to login screen directly via deep link
# This also clears the user's mental state without destroying the XCUITest driver
- openLink: lalarenteapp:///auth/login

# Step 2: Wait for login screen to fully render
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 60000

# If already on login screen — we're signed out, done
- runFlow:
    when:
      visible: "Sign in to your account"
    commands:
      - assertVisible:
          text: "Sign in to your account"
          optional: true

# Step 3: Not on login screen — navigate to tenant profile to sign out
- runFlow:
    when:
      notVisible: "Sign in to your account"
    commands:
      - openLink: lalarenteapp:///(tenant)/profile
      - extendedWaitUntil:
          visible: "My Profile"
          timeout: 30000
          optional: true

      # If not tenant, try owner
      - runFlow:
          when:
            notVisible: "My Profile"
          commands:
            - openLink: lalarenteapp:///(owner)/profile
            - extendedWaitUntil:
                visible: "Owner Account"
                timeout: 20000
                optional: true

      # If not owner, try vendor
      - runFlow:
            when:
              notVisible: "Owner Account"
            commands:
              - openLink: lalarenteapp:///(vendor)/profile
              - extendedWaitUntil:
                  visible: "Vendor Account"
                  timeout: 20000
                  optional: true

      # Scroll to find sign-out button
      - scrollUntilVisible:
          element:
            text: "Sign Out"
          direction: DOWN
          timeout: 15000
          optional: true

      - scrollUntilVisible:
          element:
            text: "Logout"
          direction: DOWN
          timeout: 10000
          optional: true

      # Tap sign-out button
      - tapOn:
          text: "Sign Out"
          optional: true

      - tapOn:
          text: "Logout"
          optional: true

      # Confirm alert
      - extendedWaitUntil:
          visible: "Are you sure"
          timeout: 10000
          optional: true

      - tapOn:
          text: "Sign Out"
          optional: true

      - tapOn:
          text: "Logout"
          optional: true

      # Wait for login screen
      - extendedWaitUntil:
          visible: "Sign in to your account"
          timeout: 30000
