name: APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  apk:
    name: Build APK (${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: |
          PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'preview' }}"
          echo "Building with profile: $PROFILE"
          npx eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          APP_VERSION: ${{ github.sha }}

      - name: Get build status
        if: always()
        run: |
          echo "Build submitted to EAS. Check status at:"
          echo "https://expo.dev/accounts/arsalanahmed82/projects/lalarente-app/builds"
