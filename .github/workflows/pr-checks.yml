name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Errors always fail. Warnings are ratcheted at the 2026-11-14 baseline
      # (legacy hex colours etc., see eslint.config.mjs) so they can only go
      # down — lower this number when warnings are cleaned up.
      - run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 4383
        env:
          CI: true

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit --skipLibCheck
        env:
          CI: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx jest --no-cache --passWithNoTests
        env:
          CI: true
          NODE_ENV: test
